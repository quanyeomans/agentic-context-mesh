# kairix.config.example.yaml
#
# The canonical operator-facing config example for kairix.
#
# Copy this file to ``kairix.config.yaml`` (or set
# ``KAIRIX_CONFIG_PATH=/path/to/your-config.yaml``) and edit the values
# for your deployment. Every block has inline comments explaining what
# each field does, which fields are optional, and — for connector /
# credential blocks — which secret names the operator must set in their
# environment so the example resolves.
#
# This file is the source-of-truth shape for ``kairix config validate``,
# the ``kairix onboard check`` topology_v2 checks, and the
# ``kairix-agent-driven-setup`` doc (docs/getting-started/agent-driven-setup.md).
# If you change the YAML shape here, update both surfaces in the same
# commit.

# ──────────────────────────────────────────────────────────────────────────
# Schema version
# ──────────────────────────────────────────────────────────────────────────
# Pin the schema version of this file. ``_schema_version`` is the version
# this example was written against. Operators running the layered-overlay
# pattern (kairix.config.local.yaml on top of the image-bundled base) may
# pin a minimum schema with ``_schema_version_required_min: N`` — kairix
# refuses to start if the image-bundled base has a lower
# ``_schema_version`` than the overlay requires. Bump this value when a
# required key is added.
_schema_version: 1

# ──────────────────────────────────────────────────────────────────────────
# Provider — the LLM / embed plugin to load
# ──────────────────────────────────────────────────────────────────────────
# Which plugin handles chat completion + embedding for this deployment.
# Each plugin owns its own credential-retrieval pattern (Azure → Key
# Vault; AWS → Secrets Manager; etc.) so the operator never wires
# secrets into this YAML. Run ``kairix probe-config`` to verify the
# selected plugin can reach its endpoint.
#
# Installed plugins (shipping today):
#   azure_foundry  — Azure AI Foundry endpoint (default for existing deploys)
#   azure_legacy   — Pre-Foundry Azure OpenAI deployment endpoint
#   openai         — OpenAI direct (api.openai.com or compatible base_url)
#   bedrock        — AWS Bedrock via boto3 credentials chain
#   ollama         — local Ollama for air-gapped / dev deployments
#   litellm_proxy  — LiteLLM proxy in front of any upstream provider
#   anthropic      — Anthropic Claude direct
#
# Secrets the example expects (set in .env / /run/secrets/kairix.env):
#   KAIRIX_PROVIDER_LLM_API_KEY   — required for every cloud provider
#   KAIRIX_PROVIDER_LLM_ENDPOINT  — required for Azure / OpenAI-compatible / LiteLLM
provider: azure_foundry

# ──────────────────────────────────────────────────────────────────────────
# Paths (optional — env-var override takes priority)
# ──────────────────────────────────────────────────────────────────────────
# Where the document corpus, SQLite index, log directory, and per-agent
# workspaces live. Each value can also be set via the matching
# ``KAIRIX_*`` env var (``KAIRIX_DOCUMENT_ROOT`` etc.), which takes
# priority. Most deployments leave this block uncommented and rely on
# the env-var defaults.
#
# paths:
#   document_root:  ~/Documents/my-knowledge-store
#   db_path:        ~/.cache/kairix/index.sqlite
#   log_dir:        ~/.cache/kairix/logs
#   workspace_root: ~/.kairix/workspaces
#   # Agent-knowledge directory under document_root. The briefing pipeline
#   # and `kairix onboard check agent_knowledge_populated` both read here.
#   # Default: "04-Agent-Knowledge"
#   agent_knowledge_dir: "04-Agent-Knowledge"
#   # Glob (relative to agent_knowledge_dir, evaluated with rglob) that
#   # identifies memory log files. Default "**/*.md" matches any markdown
#   # anywhere under the tree. Pin a stricter pattern (e.g.
#   # "*/memory/*.md") when your vault enforces a per-agent layout.
#   agent_memory_glob: "**/*.md"

# ──────────────────────────────────────────────────────────────────────────
# Retrieval — how BM25 + vector results combine, plus boost knobs
# ──────────────────────────────────────────────────────────────────────────
# The same shape as kairix.example.config.yaml. Operators typically
# leave defaults until they have a gold suite (``kairix benchmark run``)
# to tune against.
retrieval:
  # "bm25_primary" (default) — keyword-first for keyword-rich corpora
  #   (wikis, runbooks, knowledge bases).
  # "rrf" — equal weight to keyword + meaning-based; better for
  #   prose-heavy / long-form / multilingual content.
  fusion_strategy: "bm25_primary"

  boosts:
    entity:
      enabled: true
      factor: 0.20
      cap: 2.0
    procedural:
      enabled: true
      factor: 1.4
      path_patterns:
        - "(?:^|/)how-to-"
        - "(?:^|/)runbooks?/"
        - "(?:^|/)runbook-"
        - "(?:^|/)procedure"
        - "(?:^|/)sop-"
        - "(?:^|/)guide-"
        - "(?:^|/)playbook-"
    temporal:
      date_path_boost:
        enabled: false
        factor: 1.35
        recency_window_days: 90
      chunk_date_boost:
        enabled: false
        decay_halflife_days: 30

# ──────────────────────────────────────────────────────────────────────────
# Legacy collections + agents blocks (backward-compat per #305)
# ──────────────────────────────────────────────────────────────────────────
# These two blocks are the v1 operator surface — they still parse and
# still work. New deployments should declare connectors / collections
# under ``topology_v2:`` instead (see below); existing deployments are
# free to keep using these two blocks until the topology v2 migration
# completes.
#
# collections:
#   shared:
#     - name: projects
#       path: "01-Projects"
#       glob: "**/*.md"
#     - name: knowledge
#       path: "05-Knowledge"
#       glob: "**/*.md"
#   agent_pattern: "{agent}-memory"
#
# agents:
#   - name: agent-alpha
#     paths:
#       - /data/workspaces/agent-alpha
#     write_path: /data/workspaces/agent-alpha

# ──────────────────────────────────────────────────────────────────────────
# Feature flags (operator overlay for kairix.core.features.REGISTRY)
# ──────────────────────────────────────────────────────────────────────────
# Per-flag overrides for kairix's feature flag resolver. Each flag is a
# boolean. Values here override the registry default but are themselves
# overridden by ``KAIRIX_FEATURE_<NAME>`` env vars (so an operator can
# emergency-flip without editing this YAML).
#
# Run ``kairix features status`` to see which flags are on and where
# their value came from (env / config / default).
#
# features:
#   # ── Connector slots — flip ON only after the matching secrets are set.
#   # Default-off; reversible at any time by removing the entry.
#   connector_sharepoint: true            # M365 SharePoint document libraries
#   connector_slack: true                 # Slack workspace channels + DMs
#   connector_github: true                # GitHub repos / issues / pull requests
#   connector_notion: true                # Notion pages + database rows
#   connector_gmail: true                 # Gmail message body + envelope
#   connector_m365_email_headers: true    # M365 email metadata (no body)
#   connector_m365_calendar: true         # M365 calendar events
#   connector_dex_crm: true               # Dex CRM entity signals
#
#   # ── Search quality (default-OFF)
#   entity_summary_indexing_enabled: true # index entity summaries for search
#   intent_confidence_gated_boosts: true  # skip boosts on ambiguous intent
#
#   # ── Background + observability (default-OFF)
#   maintenance_loop: true                # background orphan-vector cleanup
#   pipeline_status_emit: true            # per-item per-stage status rows
#   agent_query_queue: true               # queue slow searches, carry results forward

# ──────────────────────────────────────────────────────────────────────────
# topology_v2 — connectors / collections / scope profiles / skills
# ──────────────────────────────────────────────────────────────────────────
# The Wave D operator surface for the connector / collection / scope
# topology v2 migration. Six nested blocks under a single
# ``topology_v2:`` parent key (the parent-key namespace landed in #305
# to keep the v2 ``collections:`` block from colliding with the legacy
# top-level ``collections.shared`` dict above).
#
# Gated by the ``topology_v2_config`` feature flag. When the flag is OFF
# the parser still reads the YAML but the surface is inert — rows aren't
# written to topology_cc_pairs, scope profiles aren't enforced at search
# time, skills aren't dispatched. When ON, the worker startup +
# ``kairix config validate`` + ``kairix features status`` + the new
# ``kairix onboard check topology_v2_*`` checks all read from the
# parsed surface.
#
# Full spec: docs/architecture/connector-scope-topology/ADR.md.
topology_v2:

  # ── connectors ──────────────────────────────────────────────────────────
  # Each entry declares one connector instance. ``kind`` picks the
  # plugin (must match a directory under ``kairix/connectors/``);
  # ``id`` is the cross-block reference key; ``name`` is the
  # operator-facing label.
  #
  # ``default_sensitivity`` sets the F39 tier every chunk written by
  # this connector inherits when the connector itself doesn't pin
  # per-row sensitivity (public / internal / confidential / restricted).
  connectors:
    - id: obsidian-personal-conn
      kind: obsidian
      name: "Personal Obsidian Vault"
      default_sensitivity: internal
      # connector_specific_config is a free-form key/value mapping the
      # connector plugin reads. For Obsidian: the vault root path.
      connector_specific_config:
        vault_root: "~/Documents/my-knowledge-store"

    - id: sharepoint-corp-conn
      kind: sharepoint
      name: "Corporate SharePoint Document Library"
      default_sensitivity: internal
      # ── Extraction escalation chain (optional) ─────────────────────
      # By default each connector uses a single ``extractor`` (markitdown
      # for rich documents). Set ``extractor_chain`` instead to opt into
      # the escalation chain: each tier is tried in order, falling through
      # to the next when a tier declines the mime or its ``quality_ok``
      # gate fails. The ``gotenberg`` tier converts the formats neither
      # markitdown nor pdf_fallback recover natively — legacy .doc / .xls
      # / .ppt, the OpenDocument family, Visio, Publisher, and RTF — to
      # PDF via the gotenberg HTTP service, then re-enters pdf_fallback.
      # NOTE: modern OOXML (.docx / .pptx / .xlsx) is handled IN-PROCESS by
      # the markitdown / pptx / docx / xlsx tiers and does NOT need
      # gotenberg — the gotenberg tier deliberately refuses those mimes so
      # it never shadows a working in-process extractor.
      # A gotenberg outage RAISES so the chain escalates to ocr (and, if
      # every tier fails, the item dead-letters for retry) rather than
      # silently skipping. Requires a reachable gotenberg service — run it
      # as a separately-managed service reachable at http://gotenberg:3000
      # (e.g. the deployment compose, or locally via
      # ``docker compose -f docker-compose.yml -f docker-compose.gotenberg.yml up``).
      #
      # extractor_chain: [markitdown, pdf_fallback, gotenberg, ocr]
      # extractor_chain_configs:
      #   gotenberg:
      #     # Per-member kwargs are passed to make_extractor(**kwargs).
      #     # The gotenberg factory takes a single ``config`` mapping;
      #     # unset fields fall back to the KAIRIX_GOTENBERG_* env vars
      #     # (KAIRIX_GOTENBERG_URL / _TIMEOUT_S / _MAX_FILE_SIZE_MB) and
      #     # then to the built-in defaults.
      #     config:
      #       gotenberg_url: "http://gotenberg:3000"  # compose service DNS name
      #       timeout_s: 60.0
      #       max_file_size_mb: 256
      #
      # For SharePoint: ``drives`` is a non-empty list whose entries are
      # EITHER an explicit drive OR a self-discovering site.
      #
      #  • Explicit drive — a Graph drive id (deterministic across site
      #    renames). Pin by id, not by URL. To find drive ids manually:
      #    ``az rest --method get --url
      #    'https://graph.microsoft.com/v1.0/sites?search=*'`` then
      #    ``/sites/<site-id>/drives``.
      #
      #  • SITE entry (self-discovery, F42 — foundation for the
      #    ``kairix sharepoint discover`` wizard, KFEAT-022) — name a
      #    ``site_id`` (and/or ``site_url``) and OMIT ``drive_id``: kairix
      #    auto-discovers EVERY document library on that site and syncs
      #    each one. Discovery runs lazily at sync time and re-runs every
      #    tick, so libraries added later are picked up automatically. The
      #    site's ``include_paths`` / ``exclude_paths`` are inherited by
      #    every discovered drive. A site that fails to resolve (not found
      #    / auth / throttle / empty) is logged + skipped for that tick —
      #    explicit drives and other sites keep syncing (per-site fault
      #    isolation).
      #
      # ``include_paths`` / ``exclude_paths`` (optional) scope which
      # folders within the drive get indexed. Empty = whole drive walked.
      # Prefix-match with segment boundary: ``/Curated-Content`` matches
      # ``/Curated-Content/foo.md`` but not ``/Curated-Content-Backup``.
      # Exclude wins on overlap. Case-insensitive. See
      # docs/architecture/sharepoint-path-filtering.md.
      connector_specific_config:
        drives:
          # Explicit-drive entry — pin one drive by its Graph id.
          - drive_id: "b!exampleDriveIdReplaceWithRealOne"
            site_id: "contoso.sharepoint.com,xxxx,yyyy"
            include_paths:
              - "/Curated-Content"
              - "/Shared Documents"
            exclude_paths:
              - "/Curated-Content/draft"
          # Self-discovering SITE entry — no drive_id: kairix finds and
          # syncs every document library on this site. The exclude_paths
          # below apply to each discovered drive.
          - site_id: "contoso.sharepoint.com,aaaa,bbbb"
            exclude_paths:
              - "/Archive"
          # Alternatively name the site by URL (resolved to a site_id via
          # Graph at sync time) instead of the opaque composite id:
          # - site_url: "https://contoso.sharepoint.com/sites/marketing"

    - id: slack-workspace-conn
      kind: slack
      name: "Slack — your-team workspace"
      # Sensitivity is set per channel kind by the connector itself
      # (public → internal, private → confidential, DM → personal), so
      # this default applies only to envelopes that arrive without a
      # channel id (rare). ``internal`` is the safe baseline.
      default_sensitivity: internal
      # Required: the workspace id (Slack admin → about → workspace id).
      # The bot token + app token are read from CONNECTOR_SLACK_BOT_TOKEN
      # and CONNECTOR_SLACK_APP_TOKEN; the latter is only required if you
      # want Socket Mode live events (otherwise the connector polls).
      connector_specific_config:
        workspace_id: "T01ABCDEF"

    - id: github-org-conn
      kind: github
      name: "GitHub — example-org"
      # Private repos are the GitHub default; pin ``client-confidential``
      # unless every repo is public-by-policy.
      default_sensitivity: client-confidential
      # The connector reads CONNECTOR_GITHUB_PERSONAL_ACCESS_TOKEN OR the
      # App triple (CONNECTOR_GITHUB_APP_ID / _INSTALLATION_ID /
      # _APP_PRIVATE_KEY) — provide whichever your org uses. The webhook
      # secret (CONNECTOR_GITHUB_WEBHOOK_SECRET) is required if you want
      # the live push / issues / pull_request listener.
      connector_specific_config: {}

    - id: notion-workspace-conn
      kind: notion
      name: "Notion — your-team workspace"
      default_sensitivity: internal
      # The Notion integration token (CONNECTOR_NOTION_INTEGRATION_TOKEN)
      # scopes the connector to whichever pages + databases you've shared
      # with the integration. No workspace id is required — the token
      # itself is the workspace selector.
      connector_specific_config: {}

    # Apple iCloud CalDAV — calendar event ingestion via the CalDAV
    # protocol (RFC 4791 + RFC 6578). Requires an Apple-issued
    # app-specific password (NOT the operator's primary iCloud
    # password); see https://support.apple.com/en-us/HT204397 for the
    # operator instructions. Gated by ``topology_v2_apple_caldav`` —
    # set the flag ON in ``features:`` below to enable the connector.
    # KV stores the credentials under apple-caldav-username +
    # apple-caldav-access; env-var fallbacks are CONNECTOR_APPLE_CALDAV_USERNAME +
    # CONNECTOR_APPLE_CALDAV_PASSWORD.
    # - id: apple-caldav-personal-conn
    #   kind: apple_caldav
    #   name: "Apple iCloud calendars"
    #   default_sensitivity: personal
    #   connector_specific_config:
    #     endpoint: https://caldav.icloud.com
    #     calendar_ids: []  # empty = all calendars; otherwise list CalDAV URLs

  # ── credentials ─────────────────────────────────────────────────────────
  # Each entry declares one credential bundle the connectors can
  # reference. ``secret_name`` is the logical name passed to
  # ``kairix.secrets.get_secret`` — resolution chain is env var →
  # per-file secret → bundle file → Azure Key Vault.
  #
  # For Microsoft 365 (SharePoint / m365_email_headers / m365_calendar
  # all share one Azure AD app registration), the three secrets are:
  #   connector-m365-tenant-id      → AAD tenant GUID
  #   connector-m365-client-id      → app registration client id
  #   connector-m365-client-secret  → app registration client secret
  # Set in .env (Docker) or ~/.config/kairix/secrets/ (pip) as upper-
  # case-with-underscores: CONNECTOR_M365_TENANT_ID, etc.
  credentials:
    - id: m365-oauth
      kind: oauth2_client_credentials
      secret_name: connector-m365  # pragma: allowlist secret — logical name, not a value
      # Mark this credential public when every agent should be able to
      # use it (most M365 SharePoint deployments). Leave false for
      # per-actor credentials (e.g. personal Dex CRM tokens).
      admin_public: true

    # Slack — one bot token per workspace, optionally an app token for
    # Socket Mode live events.
    #   CONNECTOR_SLACK_BOT_TOKEN  — xoxb-... (required)
    #   CONNECTOR_SLACK_APP_TOKEN  — xapp-... (only for Socket Mode)
    - id: slack-bot
      kind: bearer_token
      secret_name: connector-slack  # pragma: allowlist secret — logical name
      admin_public: true

    # GitHub — pick ONE of PAT or App-installation. Provide both env-var
    # sets here; the connector picks whichever resolves.
    #   CONNECTOR_GITHUB_PERSONAL_ACCESS_TOKEN  — ghp_... (simple path)
    #   CONNECTOR_GITHUB_APP_ID                 — App-installation path
    #   CONNECTOR_GITHUB_INSTALLATION_ID
    #   CONNECTOR_GITHUB_APP_PRIVATE_KEY        — PEM contents on one line
    #   CONNECTOR_GITHUB_WEBHOOK_SECRET         — for the live webhook listener
    - id: github-credential
      kind: github_dual_path
      secret_name: connector-github  # pragma: allowlist secret — logical name
      admin_public: true

    # Notion — single integration token; share each page/database with
    # the integration via the Notion UI before it can read them.
    #   CONNECTOR_NOTION_INTEGRATION_TOKEN  — secret_... (required)
    - id: notion-integration
      kind: bearer_token
      secret_name: connector-notion  # pragma: allowlist secret — logical name
      admin_public: true

    # Apple iCloud CalDAV — basic auth with an Apple-issued
    # app-specific password (NOT the operator's primary iCloud
    # password). KV stores the pair as apple-caldav-username +
    # apple-caldav-access; env-var fallbacks are
    # CONNECTOR_APPLE_CALDAV_USERNAME + CONNECTOR_APPLE_CALDAV_PASSWORD.
    # See https://support.apple.com/en-us/HT204397 for how operators
    # generate or rotate the app-password.
    # - id: apple-caldav-icloud
    #   kind: basic_auth
    #   secret_name_prefix: apple-caldav  # KV: apple-caldav-username + apple-caldav-access  # pragma: allowlist secret — logical prefix
    #   admin_public: false  # personal calendar — operator only

  # ── cc_pairs (ConnectorCredentialPair) ──────────────────────────────────
  # Each entry binds one connector to one credential. The cc_pair is
  # the runtime unit the worker schedules — every sync, every chunk
  # write, every status row keys off the cc_pair id.
  #
  # ``access_type``: PUBLIC (any agent can search) / PRIVATE (only the
  # credential owner) / SYNC (cc_pair only syncs, never serves search).
  cc_pairs:
    - id: obsidian-personal-pair
      connector: obsidian-personal-conn
      credential: null            # local Obsidian needs no credential
      name: obsidian-personal     # the human-readable cc_pair name
      access_type: PRIVATE        # personal vault — only the owner

    - id: sharepoint-corp-pair
      connector: sharepoint-corp-conn
      credential: m365-oauth
      name: sharepoint-corp       # the human-readable cc_pair name
      access_type: PUBLIC         # every agent can search corporate library

  # ── collections ─────────────────────────────────────────────────────────
  # Each entry is a retrieval bucket. ``sources`` is a list of
  # (cc_pair, optional path_filter, optional sensitivity_min) entries
  # — a collection can span multiple cc_pairs (e.g. one "policies"
  # collection sourced from Obsidian + SharePoint + Notion).
  collections:
    - name: obsidian-all
      sources:
        - cc_pair: obsidian-personal-pair
          path_filter: "*"        # everything under the vault root

    - name: sharepoint-public-docs
      sources:
        - cc_pair: sharepoint-corp-pair
          path_filter: "**/Public/**"
          sensitivity_min: internal   # exclude confidential-tier rows from this collection

  # ── scope_profiles ──────────────────────────────────────────────────────
  # Each entry declares one actor's read/write scope across the
  # declared collections. Used by the search pipeline to filter which
  # collections each agent can reach.
  #
  # ``mode`` is one of read / write / read_write (default: read).
  # ``actor_kind`` picks the resolution chain: agent / human / team /
  # group / skill (default: agent).
  scope_profiles:
    - name: default-agent-profile
      actor_kind: agent
      entries:
        - actor_id: agent-alpha
          collection_name: obsidian-all
          mode: read_write
        - actor_id: agent-alpha
          collection_name: sharepoint-public-docs
          mode: read

  # ── skills ──────────────────────────────────────────────────────────────
  # Each entry is a composable retrieval strategy — a virtual
  # collection aggregator + retrieval recipe. Skills are dispatched
  # from the search pipeline when an agent asks for "search via skill
  # <name>"; the routing matrix lives in the Wave C ChunkerRegistry.
  #
  # Most deployments start with zero skills declared (default-safe);
  # add one once the operator has identified a recurring retrieval
  # shape (e.g. "corporate-policies-only").
  skills:
    - name: corporate-policies-only
      task_collections:
        - name: policies
          sources:
            - cc_pair: sharepoint-corp-pair
              path_filter: "**/Policies/**"

# ──────────────────────────────────────────────────────────────────────────
# Cutover — feature-flag flip baseline capture
# ──────────────────────────────────────────────────────────────────────────
# Read by ``scripts/cutover/capture_baseline.py`` (see
# ``docs/architecture/feature-flag-architecture.md`` §4.2). When the
# operator runs ``capture_baseline.py`` it picks each query in
# ``sample_queries`` and probes ``kairix search --json`` to capture the
# top-5 doc paths. The diff tool then asserts >=80% of queries retain
# >=3/5 paths after the flip.
#
# Pick 3-5 queries that are stable + representative across the corpora
# you're cutting over — recurring agent tasks, frequent retrieval
# patterns, anchor topics. Avoid time-sensitive queries (e.g. "what
# happened today") because the same query will return different docs
# on the post-flip side just from clock drift.
#
# When this block is missing or empty, the capture script falls back to
# a single canned query ("default sample query") so the surface still
# emits a row — the parity gate degenerates to "did the canned query
# return the same paths before and after" which is weak signal but not
# zero signal.
cutover:
  sample_queries:
    - "how do we onboard a new connector"
    - "retrieval pipeline architecture overview"
    - "feature flag retirement deadline policy"
    - "how does the cutover protocol work"
    - "what does safe-commit.sh check"
