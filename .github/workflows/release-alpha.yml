name: "2a · Release (alpha tag from main)"

# Manual-dispatch alpha release workflow (Phase 1 of #272). Tags the
# current main HEAD as vYYYY.M.D[.N]aN, creates a GitHub pre-release,
# and fans out to docker-publish + publish-pypi with the is_alpha flag
# set so downstream workflows skip the :latest tag / stable PyPI index.
#
# Pre-requisite: the main HEAD SHA must have a successful CI gate
# run; otherwise the alpha is rejected before any tag is pushed.
#
# All input values are passed through env: bindings before being used
# in run: scripts (avoids workflow-injection via input string).

on:
  workflow_dispatch:
    inputs:
      date_version:
        description: 'CalVer date portion (e.g. 2026.5.15 or 2026.5.15.1 for same-day alpha of patch)'
        required: true
        type: string
      alpha_n:
        description: 'Alpha sequence number (1, 2, 3, ...)'
        required: false
        default: '1'
        type: string
      skip_vm_deploy:
        description: 'Skip the Customer-Zero VM auto-deploy (for fresh-VM / manual verification of the alpha)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # required to create tags + pre-releases
  actions: write    # required to dispatch downstream publish workflows

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cut-alpha:
    name: Tag main + create alpha pre-release
    runs-on: ubuntu-latest
    # Restrict to main branch — alpha is an in-flight signal, not a
    # branch-agnostic release artefact.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Validate inputs
        env:
          DATE_VERSION: ${{ inputs.date_version }}
          ALPHA_N: ${{ inputs.alpha_n }}
        run: |
          if ! echo "$DATE_VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$'; then
            echo "::error::date_version '$DATE_VERSION' does not match CalVer pattern YYYY.M.D[.N]"
            echo "::error::fix: pass date_version like '2026.5.15' or '2026.5.15.1' (no leading 'v', no 'a' suffix)"
            exit 1
          fi
          if ! echo "$ALPHA_N" | grep -Eq '^[0-9]+$'; then
            echo "::error::alpha_n '$ALPHA_N' must be a positive integer"
            echo "::error::fix: pass alpha_n like '1', '2', '3'"
            exit 1
          fi
          TAG="v${DATE_VERSION}a${ALPHA_N}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::tag '$TAG' already exists"
            echo "::error::next: bump alpha_n (e.g. $((ALPHA_N + 1))) and re-run"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Validate CI gate passed on main HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Defers to scripts/ci/check_release_gate.py which mirrors
          # ci.yml's paths-ignore exactly. Old strict-equality check
          # failed every time a docs-only commit landed on main between
          # the last code change and the alpha cut. The Python gate
          # walks LAST_SUCCESS_SHA..HEAD and accepts the gap only if
          # every commit there is docs-only. Regression-locked by
          # tests/scripts/test_check_release_gate.py.
          LAST_SUCCESS_SHA="$(gh run list \
              --workflow=ci.yml \
              --branch=main \
              --status=success \
              --limit=1 \
              --json headSha \
              --jq '.[0].headSha // empty')"
          python3 scripts/ci/check_release_gate.py \
              --head-sha "$HEAD_SHA" \
              --last-success-sha "$LAST_SUCCESS_SHA"

      - name: Tag main HEAD
        env:
          DATE_VERSION: ${{ inputs.date_version }}
          ALPHA_N: ${{ inputs.alpha_n }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${DATE_VERSION}a${ALPHA_N}"
          git tag -a "$TAG" -m "kairix alpha $TAG"
          git push origin "$TAG"

      - name: Build reference-library corpus tarball (#450)
        # The reference-library corpus is NOT bundled in the wheel
        # (mixed-license, ~50 MB). `kairix benchmark install-corpus` fetches
        # it from this per-release asset, sha256-verified fail-closed. The
        # asset name matches the URL template in
        # kairix/quality/benchmark/corpus.py (reference-library-v{version}.tar.gz,
        # where the alpha tag is v{version}). Mirrors release.yml so an alpha is
        # benchmark-provable, not just the stable release.
        env:
          DATE_VERSION: ${{ inputs.date_version }}
          ALPHA_N: ${{ inputs.alpha_n }}
        run: |
          TAG="v${DATE_VERSION}a${ALPHA_N}"
          tarball="reference-library-${TAG}.tar.gz"
          tar czf "$tarball" reference-library/
          sha256sum "$tarball" | awk '{print $1}' > "${tarball}.sha256"
          echo "::group::Corpus asset"
          ls -lh "$tarball" "${tarball}.sha256"
          cat "${tarball}.sha256"
          echo "::endgroup::"

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          DATE_VERSION: ${{ inputs.date_version }}
          ALPHA_N: ${{ inputs.alpha_n }}
        run: |
          TAG="v${DATE_VERSION}a${ALPHA_N}"
          # Attach the corpus tarball + sha256 sidecar (#450) so
          # `kairix benchmark install-corpus` can fetch + verify them on the alpha.
          gh release create "$TAG" \
              --title "kairix $TAG (alpha)" \
              --notes "Alpha pre-release for validation. Do not use in production." \
              --prerelease \
              --verify-tag \
              "reference-library-${TAG}.tar.gz" \
              "reference-library-${TAG}.tar.gz.sha256"

      - name: Fan out to docker-publish + publish-pypi + vm-deploy (alpha mode)
        # All three downstream workflows are triggered explicitly because
        # GitHub deliberately won't fire ``release: types: [prereleased]``
        # for releases created via GITHUB_TOKEN (the safety that breaks
        # self-fan-out from inside a workflow). docker-publish and
        # publish-pypi were already explicit; release-vm-deploy was
        # missing, so every alpha had to be manually kicked from the UI
        # or the deploy never happened — caught when v2026.5.25a1's
        # webhook never fired despite the prerelease being marked.
        env:
          GH_TOKEN: ${{ github.token }}
          DATE_VERSION: ${{ inputs.date_version }}
          ALPHA_N: ${{ inputs.alpha_n }}
          SKIP_VM_DEPLOY: ${{ inputs.skip_vm_deploy }}
        run: |
          TAG="v${DATE_VERSION}a${ALPHA_N}"
          gh workflow run docker-publish.yml --ref main -f ref="$TAG" -f is_alpha=true
          gh workflow run publish-pypi.yml   --ref main -f ref="$TAG" -f is_alpha=true
          if [ "$SKIP_VM_DEPLOY" = "true" ]; then
            echo "skip_vm_deploy=true — NOT dispatching release-vm-deploy.yml (the Customer-Zero webhook); deploy the alpha manually for verification."
          else
            gh workflow run release-vm-deploy.yml --ref main -f tag="$TAG"
          fi

      - name: Summary
        env:
          DATE_VERSION: ${{ inputs.date_version }}
          ALPHA_N: ${{ inputs.alpha_n }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          TAG="v${DATE_VERSION}a${ALPHA_N}"
          {
            echo "## Alpha $TAG created"
            echo ""
            echo "- Tag pushed: [\`$TAG\`]($SERVER/$REPO/releases/tag/$TAG)"
            echo "- GitHub pre-release created"
            echo "- Downstream publishes dispatched (is_alpha=true):"
            echo "  - 3 · Docker publish (release)"
            echo "  - 4 · PyPI publish (release)"
          } >> "$GITHUB_STEP_SUMMARY"
