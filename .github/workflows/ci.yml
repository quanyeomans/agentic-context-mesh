name: "1 · Quality gate"

# Engineering hub compliance: 4-stage pipeline (contracts -> unit+type -> integration -> security)
# Ref: engineering-hub/standards/DEVELOPMENT-WORKFLOW.md, TESTING-STRATEGY.md

on:
  push:
    branches: [main]
    # Skip the workflow entirely on docs-only commits — saves ~15s of
    # 'changes' job runner allocation that would otherwise just confirm
    # nothing else needs to run. The internal dorny/paths-filter still
    # operates for partial cases where some-but-not-all paths changed.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "!CLAUDE.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "!CLAUDE.md"
  workflow_dispatch:

# Deny all permissions by default. Each job declares its own minimum.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Path-based change detection ────────────────────────────────────────────
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
      reflib: ${{ steps.filter.outputs.reflib }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            python:
              - 'kairix/**/*.py'
              - 'tests/**/*.py'
              - 'pyproject.toml'
              # SonarCloud's rule set + exclusions live in sonar-project.properties;
              # editing the file is a Python-quality-relevant change even though
              # no .py touched. Without this entry, project.properties edits
              # silently skip the sonarcloud job (#XXX — observed on 0b4095d9).
              - 'sonar-project.properties'
              # The fitness machinery itself: a change to the CHECK SCRIPTS,
              # the safe-commit driver, the grandfathering baselines, or the
              # rule catalogue must always run Stage 0 arch-fitness (+
              # pre-commit + contracts, which share this filter). Without
              # these entries a scripts/checks/ change skips Stage 0 entirely
              # — confirmed on PR #508, where a scripts/checks/ edit had
              # Stage 0 "skipping" so the fitness rules never validated the
              # change to the fitness rules. (#499 phase 4.)
              - 'scripts/checks/**'
              - 'scripts/safe-commit.sh'
              - '.architecture/baseline/**'
              - '**/_rule_catalogue.py'
            docker:
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - 'docker/**'
            docs:
              - 'docs/**'
              - '*.md'
              - '!CLAUDE.md'
            reflib:
              - 'kairix/knowledge/reflib/**'
              - 'reference-library/**'
            # Stage 4.5 (composed-production-path E2E) covers install, container,
            # connectors, search/factory/embed surfaces. Most kairix/** edits DO
            # affect at least one composed path. Excluding only the test scopes
            # that DON'T trigger E2E (unit/contract/bdd are their own scopes) plus
            # benchmark-probe scripts (perf measurement, not behaviour).
            e2e:
              - 'kairix/**'
              - '!kairix/quality/probe/**'
              - 'tests/e2e/**'
              - '!tests/unit/**'
              - '!tests/contract/**'
              - '!tests/bdd/**'
              - '!tests/soak/**'
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - 'docker/**'
              - 'pyproject.toml'

  # ── Pre-commit (linting, formatting, secrets, file hygiene) ────────────────
  pre-commit:
    name: "Pre-commit checks"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The arch-fitness-catalogue hook runs `uv run python3 …` so the
      # catalogue runner imports kairix + the shared three-cubes-fitness
      # package. Sync the venv (and put uv on PATH) before pre-commit runs.
      - uses: three-cubes/tc-pipelines/actions/setup-uv-cached@4a5fb3c4dead13a3dd0203bd4ce24c5855dfa08c # v1
        with:
          python-version: "3.12"
          sync-args: "--all-extras --all-groups"

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # ── Stage 1: Contracts (fast -- <30s) ──────────────────────────────────────
  # Engineering hub: "Stop pipeline on failure. Contract tests must execute in <30s."
  # ── Stage 0: Architecture fitness functions ───────────────────────────────
  # Block at PR time on any net-new violation of the architectural rules
  # encoded in scripts/checks/. Pre-existing files are grandfathered in
  # .architecture/baseline/ and the baseline is expected to shrink over
  # time. See docs/architecture/fitness-functions.md.
  arch-fitness:
    name: "Stage 0 -- Architecture fitness"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The fitness checks import kairix + the shared three-cubes-fitness
      # package (tc_fitness, in the [dev] group). Running them under the
      # bare system interpreter silently masks every import-dependent rule
      # as a vacuous pass (this is the F53 false-green #499 phase 4 closes).
      # Sync the venv via the org-shared composite, then run the gate under it.
      - uses: three-cubes/tc-pipelines/actions/setup-uv-cached@4a5fb3c4dead13a3dd0203bd4ce24c5855dfa08c # v1
        with:
          python-version: "3.12"
          sync-args: "--all-extras --all-groups"

      # The org-canonical Python gate: `tc-fitness run` reads kairix's
      # [tool.tc_fitness] block (pyproject.toml) and dispatches the SAME
      # ALL_ENTRIES catalogue run-all.sh / safe-commit.sh run locally — the
      # convergence surface tc-agent-zone also runs (and what the reusable
      # tc-pipelines/python-quality-gate.yml@v1 invokes). Any core:<module>
      # row runs in-process with its [tool.tc_fitness.core_checks.<module>]
      # config injected. Stage 0 stays its own job — Stage 1..5 (contracts /
      # integration / e2e / soak) are untouched.
      - name: Architecture fitness functions (tc-fitness run — full catalogue)
        env:
          # F73 loads private-infra patterns from this secret. Empty/unset
          # = detector no-ops (forks and external contributors still pass).
          # The engine's subprocess dispatch inherits the job env, so F73's
          # detector reads it exactly as it did under run-all.sh.
          PRIVATE_INFRA_PATTERNS: ${{ secrets.PRIVATE_INFRA_PATTERNS }}
        run: uv run tc-fitness run

  contracts:
    name: "Stage 1 -- Contracts"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Org-shared uv install seam (#499 phase 4, PR1). Replaces the
      # actions/setup-python + `pip install -e ".[...]"` pair with the
      # three-cubes/tc-pipelines composite, which sets up uv (with cache)
      # and runs `uv sync`. `--all-extras --all-groups` is the superset of
      # the previous extras set, so the [agents] extras (starlette via
      # mcp>=1.20) are still present and the MCP transport contract test
      # runs here rather than being skipped by `importorskip("starlette")`.
      # kairix is a single package (not a uv workspace) — do NOT pass
      # --all-packages. Pinned to @main until the action repo cuts tags.
      - uses: three-cubes/tc-pipelines/actions/setup-uv-cached@4a5fb3c4dead13a3dd0203bd4ce24c5855dfa08c # v1
        with:
          python-version: "3.12"
          sync-args: "--all-extras --all-groups"

      - name: Contract tests (schema validation, interface agreements)
        # `uv run` executes inside the .venv that `uv sync` populated — the
        # composite action installs but does not activate it for later steps.
        run: |
          uv run pytest tests/ -m contract -v --tb=short --timeout=30 \
            --junitxml=results-contracts.xml

      - name: "paths-DI deprecation: count remaining monkeypatch.setenv(KAIRIX_*)"
        # Tracks progress of the paths-DI refactor (see docs/architecture/paths-di-refactor.md
        # and umbrella issue #139). Phase 0 ships warn-only. Phase 4 flips to fail.
        # Operates only on checked-out repo files; no untrusted GitHub-event input.
        run: |
          set +e
          MATCHES=$(grep -rln 'monkeypatch.setenv("KAIRIX_' tests/ --include='*.py' 2>/dev/null | sort -u)
          COUNT=$(printf '%s\n' "$MATCHES" | grep -c .)
          echo "::notice::paths-DI: ${COUNT} test files still call monkeypatch.setenv(KAIRIX_*) -- see docs/architecture/paths-di-refactor.md"
          if [ "$COUNT" -gt 0 ]; then
            echo "Files using monkeypatch.setenv(KAIRIX_*):"
            printf '  %s\n' "$MATCHES"
          fi
          # WARN-ONLY in Phase 0 -- exit 0 regardless. Phase 4 will switch to:
          #   if [ "$COUNT" -gt 0 ]; then exit 1; fi
          exit 0

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-contracts
          path: results-contracts.xml
          retention-days: 14

      - name: Upload contract test results to Codecov (test analytics)
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          files: results-contracts.xml
          flags: contract
          fail_ci_if_error: false  # codecov outage / rate-limit must not block merge — analytics is diagnostic, not gate
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Stage 2: Unit tests + type checking (2 min) ───────────────────────────
  # Engineering hub: "Type checking: zero errors. Coverage: >=80%."
  unit-and-type:
    name: "Stage 2 -- Unit + Type (${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: [changes, contracts]
    if: needs.changes.outputs.python == 'true'
    permissions:
      contents: read
      checks: write       # required to post test results as PR checks
    strategy:
      fail-fast: false
      matrix:
        # PR-time: only 3.12 (the project's pinned runtime). Push-to-main:
        # full 3.10/3.11/3.12 matrix as the regression net. 3.10 + 3.11
        # specific bugs are caught on the main push before any release tag.
        # Saves ~1.3 min critical path on every PR (3.10 was the slowest
        # at 7.3 min; dropping it leaves 3.12 at 6.5 min as the matrix max).
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.10", "3.11", "3.12"]') }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install OCR runtime (tesseract binary)
        # MM-2 OCR extractor needs tesseract on PATH for tests to run;
        # skips drop F7 coverage below the 85% floor. apt-installable
        # Apache-2.0 binary; no untrusted inputs.
        run: sudo apt-get install -y tesseract-ocr

      - name: Install dependencies (with type stubs)
        # The [agents] extras pull in mcp>=1.20 (and starlette transitively) so
        # tests/agents/mcp/test_transport_composition.py — which guards its
        # imports with `pytest.importorskip("starlette")` — actually runs in
        # the unit job rather than silently skipping. Without this, the
        # transport composer's coverage measures as 0% even though the unit
        # tests exist, and F7 fails the per-file floor.
        run: |
          pip install -e ".[dev,agents,markitdown,pdf_fallback,ocr,pptx,docx,xlsx]"

      - name: Type checking -- mypy strict
        # Engineering hub: "mypy -- zero errors". Strict mode from Phase 1.
        run: |
          mypy kairix/ \
            --ignore-missing-imports \
            --disallow-untyped-defs \
            --disallow-incomplete-defs \
            --check-untyped-defs \
            --no-implicit-optional \
            --warn-redundant-casts \
            --warn-unused-ignores \
            --warn-return-any \
            --strict-equality

      - name: Linting -- ruff (GitHub annotations)
        # Engineering hub: "Linting / code quality: blocks merge."
        run: |
          ruff check kairix/ tests/ --output-format github
          ruff format --check kairix/ tests/

      - name: Enable systemd --user bus for install-mode tests
        # Plan 1 install BDD + E2E need a logind session bus to run
        # `systemctl --user daemon-reload + enable` against tmp-rooted XDG dirs.
        # Without this, kairix.install.systemd.install_unit() fails and the
        # 5 user-mode BDD scenarios + 2 E2E install tests skip.
        run: |
          # Enable lingering so the user manager persists outside login sessions
          sudo loginctl enable-linger "$USER"
          # Explicitly start the user manager — enable-linger alone doesn't
          # create the bus retroactively in non-interactive runner sessions.
          UID_N=$(id -u "$USER")
          sudo systemctl start "user@${UID_N}.service"
          # Wait for the user manager to come up
          timeout 30 bash -c "until systemctl --user --no-pager status >/dev/null 2>&1; do sleep 1; done"
          # Propagate XDG_RUNTIME_DIR + DBUS_SESSION_BUS_ADDRESS to all
          # downstream steps via \$GITHUB_ENV so pytest subprocesses inherit them.
          echo "XDG_RUNTIME_DIR=/run/user/${UID_N}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID_N}/bus" >> "$GITHUB_ENV"
          # Verify
          XDG_RUNTIME_DIR=/run/user/${UID_N} DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID_N}/bus \
            systemctl --user is-system-running || true

      - name: Unit + BDD + Contract tests with coverage
        run: |
          pytest tests/ \
            -m "unit or bdd or contract" \
            --cov=kairix \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=results-unit.xml \
            -v --tb=short


      - name: F7 — per-file coverage floor (85%)
        # Repo-wide coverage averages can hide files at 0%. F7 requires every
        # file in coverage.xml to clear the 85% floor; pre-existing files
        # below the floor are grandfathered in
        # .architecture/baseline/per-file-coverage-floor-files.txt and the
        # baseline is expected to shrink over time. Runs only on 3.12 to
        # match the Codecov upload step (XML uses Python-version-specific
        # paths in some configs).
        if: matrix.python-version == '3.12'
        run: python3 scripts/checks/check_per_file_coverage.py coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-unit-${{ matrix.python-version }}
          path: results-unit.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false  # codecov upload race must not block merge; F7 is the mechanical floor, not Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload unit test results to Codecov (test analytics)
        # Codecov Test Analytics: tracks flaky tests, slow tests, and
        # failure trends across runs. Free for OSS. Same CODECOV_TOKEN as
        # the coverage upload. Only the 3.12 matrix uploads (consistent
        # with the coverage upload).
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          files: results-unit.xml
          flags: unit
          fail_ci_if_error: false  # codecov outage / rate-limit must not block merge — analytics is diagnostic, not gate
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts (3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-data
          # `include-hidden-files: true` is required because upload-artifact@v4
          # excludes dotfiles by default — `.coverage` is a dotfile that
          # py-cov-action needs to render the PR coverage comment. F9 itself
          # reads coverage.xml (not .coverage), so this upload is purely
          # for the Coverage report job below; if .coverage isn't present
          # at upload time the job degrades but doesn't block.
          include-hidden-files: true
          path: |
            .coverage
            coverage.xml
          retention-days: 7

  # ── Coverage delta PR comment ─────────────────────────────────────────────
  coverage:
    name: "Coverage report"
    runs-on: ubuntu-latest
    needs: [changes, unit-and-type]
    if: github.event_name == 'pull_request' && needs.changes.outputs.python == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-data

      - uses: py-cov-action/python-coverage-comment-action@78c938b53befa55f59091c6a5b8cf12f38ad6484 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
        continue-on-error: true  # PR comment is informational; failure (e.g. fork PR with no token) must not block

  # ── Stage 3: Integration tests ─────────────────────────────────────────────
  # Engineering hub: "Stop on >3 failures. Only mock external systems."
  # Depends on `contracts` only (not unit-and-type) — integration tests use a
  # disjoint test surface from unit tests, and `contracts` is the import-graph
  # gate that catches any broken collection. Decoupling from unit-and-type
  # saves ~6 min wall-clock on the critical path (Stage 3 starts immediately
  # after contracts instead of waiting for the slowest 3.x matrix entry).
  # Trade-off: a PR that breaks both unit + integration burns Stage 3 runner
  # minutes that the serial dependency would have skipped. Most PRs are
  # clean, so net positive.
  integration:
    name: "Stage 3 -- Integration"
    runs-on: ubuntu-latest
    needs: [changes, contracts]
    if: needs.changes.outputs.python == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # The agents extras (mcp>=1.20) are required for
        # tests/integration/test_mcp_build_server.py — those probes exercise
        # the production build_server() wiring and need the real FastMCP
        # package, not a stub.
        run: pip install -e ".[dev,agents,markitdown,pdf_fallback,ocr,pptx,docx,xlsx]"

      - name: Enable systemd --user bus for install-mode tests
        # Plan 1 integration tests (tests/integration/test_cli_init.py +
        # test_cli_uninstall.py) exercise `kairix init --user` which runs
        # `systemctl --user daemon-reload + enable`. Without an active logind
        # session bus the subprocess fails. Mirrors the same step on the
        # Stage 2 unit job + Stage 4.5 e2e job.
        run: |
          # Enable lingering so the user manager persists outside login sessions
          sudo loginctl enable-linger "$USER"
          # Explicitly start the user manager — enable-linger alone doesn't
          # create the bus retroactively in non-interactive runner sessions.
          UID_N=$(id -u "$USER")
          sudo systemctl start "user@${UID_N}.service"
          # Wait for the user manager to come up
          timeout 30 bash -c "until systemctl --user --no-pager status >/dev/null 2>&1; do sleep 1; done"
          # Propagate XDG_RUNTIME_DIR + DBUS_SESSION_BUS_ADDRESS to all
          # downstream steps via \$GITHUB_ENV so pytest subprocesses inherit them.
          echo "XDG_RUNTIME_DIR=/run/user/${UID_N}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID_N}/bus" >> "$GITHUB_ENV"
          # Verify
          XDG_RUNTIME_DIR=/run/user/${UID_N} DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID_N}/bus \
            systemctl --user is-system-running || true

      - name: Integration tests
        # Coverage collected and uploaded so production-wiring code
        # exercised only at integration scope (factory.build_search_pipeline,
        # mcp.server.build_server, db.repository SQL surface) is measured.
        # `--cov-fail-under=0` overrides pyproject's `fail_under = 80` —
        # integration tests target wiring, not the full surface, and the
        # 80% floor is enforced by Stage 2 (where the unit suite runs).
        # F7 enforces per-file coverage from the unit run; F9 (Stage 5)
        # combines this with the unit .coverage to enforce the same floor
        # over the union, which catches integration-only files.
        run: |
          pytest tests/ -m integration -v --tb=short --maxfail=3 \
            --cov=kairix \
            --cov-report=xml:coverage-integration.xml \
            --cov-fail-under=0 \
            --junitxml=results-integration.xml

      - name: Upload integration coverage XML (for F9 union)
        # F9 reads the XML reports from unit + integration and merges
        # them per-line in Python (scripts/checks/merge_coverage_xml.py).
        # We deliberately upload the XML rather than the .coverage data
        # file — the XML is not a hidden file (no `include-hidden-files`
        # workaround needed), and the merge tool reads Cobertura XML
        # directly so we don't depend on `coverage combine`'s data-file
        # behaviour.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-data-integration
          path: coverage-integration.xml
          retention-days: 7

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-integration.xml
          flags: integration
          fail_ci_if_error: false  # codecov upload race must not block merge; F7 is the mechanical floor, not Codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload integration test results to Codecov (test analytics)
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          files: results-integration.xml
          flags: integration
          fail_ci_if_error: false  # codecov outage / rate-limit must not block merge — analytics is diagnostic, not gate
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Verify core imports
        run: |
          python -c "from kairix.core.embed.embed import build_hash_seq; print('Embed OK')"
          python -c "from kairix.knowledge.store.crawler import crawl; print('Store OK')"
          python -c "from kairix.knowledge.reflib.sources import SOURCES; print(f'Reflib OK: {len(SOURCES)} sources')"

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-integration
          path: results-integration.xml
          retention-days: 14

  # ── Stage 4.5: F48 — composed production path e2e ─────────────────────────
  # Runs the @pytest.mark.e2e selector over tests/e2e/, which currently
  # consists of the F48 canonical exemplar
  # (tests/e2e/test_composed_production_path.py). The exemplar exercises
  # config -> factory.build_search_pipeline -> ingest -> query against
  # real SQLite + FTS5 in a tmpdir — the composed-production-path test
  # whose absence allowed the Plan-B-parity LoCoMo regression.
  # See docs/architecture/test-discipline-hardening.md §3 (F48) + §4.3.
  e2e-composed-path:
    name: "Stage 4.5 -- F48 composed production path e2e"
    runs-on: ubuntu-latest
    # Depends on `contracts` only (not integration) — E2E tests exercise the
    # composed production path through subprocess CLI invocations, disjoint
    # from integration's in-process factory.build_* calls. Decoupling lets
    # E2E run in parallel with Stage 2 + Stage 3 instead of after both.
    # Gated on the narrower `e2e` paths filter (excludes test-only edits
    # to tests/unit, tests/contract, tests/bdd, tests/soak + probe scripts
    # — none of these can affect a composed-production-path E2E).
    needs: [changes, contracts]
    if: needs.changes.outputs.e2e == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,agents,markitdown,pdf_fallback,ocr,pptx,docx,xlsx]"

      - name: Enable systemd --user bus for install-mode tests
        # Plan 1 install BDD + E2E need a logind session bus to run
        # `systemctl --user daemon-reload + enable` against tmp-rooted XDG dirs.
        # Without this, kairix.install.systemd.install_unit() fails and the
        # 5 user-mode BDD scenarios + 2 E2E install tests skip.
        run: |
          # Enable lingering so the user manager persists outside login sessions
          sudo loginctl enable-linger "$USER"
          # Explicitly start the user manager — enable-linger alone doesn't
          # create the bus retroactively in non-interactive runner sessions.
          UID_N=$(id -u "$USER")
          sudo systemctl start "user@${UID_N}.service"
          # Wait for the user manager to come up
          timeout 30 bash -c "until systemctl --user --no-pager status >/dev/null 2>&1; do sleep 1; done"
          # Propagate XDG_RUNTIME_DIR + DBUS_SESSION_BUS_ADDRESS to all
          # downstream steps via \$GITHUB_ENV so pytest subprocesses inherit them.
          echo "XDG_RUNTIME_DIR=/run/user/${UID_N}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID_N}/bus" >> "$GITHUB_ENV"
          # Verify
          XDG_RUNTIME_DIR=/run/user/${UID_N} DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID_N}/bus \
            systemctl --user is-system-running || true

      - name: F48 — composed production path e2e
        run: |
          pytest -m e2e tests/e2e/ -v --tb=short

  # ── Stage 5: Union coverage floor (F9) ─────────────────────────────────────
  # Runs F7's per-file 85% floor against the UNION of unit + integration
  # coverage. Catches files exercised only at integration scope (factory.py,
  # mcp/server.py, db/repository.py) that F7 alone would still see at 0%.
  # The union baseline lives in
  # .architecture/baseline/per-file-coverage-floor-union-files.txt and
  # ratchets independently of F7's unit-only baseline.
  union-coverage:
    name: "Stage 5 -- Union coverage floor (F9)"
    runs-on: ubuntu-latest
    needs: [changes, unit-and-type, integration]
    if: needs.changes.outputs.python == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # check_per_file_coverage.py imports the shared three-cubes-fitness
      # package (tc_fitness, in the [dev] group), so this job needs the
      # synced venv — not a bare interpreter. Sync via the org-shared
      # composite and run the floor check under `uv run`.
      - uses: three-cubes/tc-pipelines/actions/setup-uv-cached@4a5fb3c4dead13a3dd0203bd4ce24c5855dfa08c # v1
        with:
          python-version: "3.12"
          sync-args: "--all-extras --all-groups"

      - name: Download unit coverage XML
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-data

      - name: Download integration coverage XML
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-data-integration

      - name: Merge unit + integration coverage XMLs
        # We merge the Cobertura XML reports per-line instead of running
        # `coverage combine` on .coverage data files. Reasons:
        #   1. .coverage is a hidden dotfile; upload-artifact@v4 excludes
        #      dotfiles by default — workarounds were unreliable.
        #   2. pytest-cov's data-file behaviour differs subtly between
        #      unit and integration invocations (notably with
        #      --cov-fail-under=0), making `.coverage` an inconsistent
        #      target.
        #   3. The XML is the source of truth that F7 already consumes,
        #      so reusing it keeps the data path identical for both
        #      gates.
        # The merger lives at scripts/checks/merge_coverage_xml.py.
        run: |
          uv run python3 scripts/checks/merge_coverage_xml.py coverage.xml coverage-integration.xml coverage-union.xml

      - name: F9 -- per-file 85% floor on union coverage
        run: |
          uv run python3 scripts/checks/check_per_file_coverage.py coverage-union.xml per-file-coverage-floor-union

  # ── Stage 4: Security ──────────────────────────────────────────────────────
  # Engineering hub: "4-layer defence: SAST, dependency analysis, dynamic, source control."
  security:
    name: "Stage 4 -- Security"
    runs-on: ubuntu-latest
    # bandit / pip-audit / detect-secrets are import-graph-independent — they
    # scan source + dependency manifests, not the unit test surface, so they
    # don't need the unit matrix to pass first. Parented on `changes` alone,
    # security now overlaps Stage 2 (#499 Phase 2) instead of waiting for it.
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    # Run in parallel with integration + the unit matrix -- no test dependency
    permissions:
      contents: read
      security-events: write   # required to upload SARIF / security findings

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Full history for secret scanning

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tools
        run: |
          pip install bandit pip-audit detect-secrets

      # Layer 1: SAST -- bandit
      # Engineering hub: "Bandit -- zero HIGH/MEDIUM findings."
      - name: SAST -- bandit
        run: |
          bandit -r kairix/ \
            --severity-level medium \
            --confidence-level medium \
            --format txt \
            --exit-zero \
            -o bandit-report.txt
          cat bandit-report.txt
          # Fail on HIGH severity (gate). MEDIUM documented in report only.
          bandit -r kairix/ \
            --severity-level high \
            --confidence-level high \
            --format txt

      # Layer 2: Dependency vulnerability scanning
      # Engineering hub: "No known CVEs with patches available. Update within 1 week."
      - name: Dependency scan -- pip-audit
        run: |
          pip install -e ".[dev]"
          pip-audit \
            --requirement <(pip freeze) \
            --format markdown \
            --output pip-audit-report.md \
            --strict
        continue-on-error: true  # Report but don't block — transitive dependency CVEs may not have fixes

      # Layer 4: Secret scanning against baseline
      # Engineering hub: "No secrets in commit history."
      - name: Secret scan -- detect-secrets
        run: |
          detect-secrets scan --baseline .secrets.baseline
          detect-secrets audit --report .secrets.baseline || true

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-reports-${{ github.run_id }}
          path: |
            bandit-report.txt
            pip-audit-report.md
          retention-days: 30

  # ── Code quality: SonarCloud ───────────────────────────────────────────────
  # Catches duplication, code smells, complexity, maintainability debt.
  # This job uploads coverage.xml + test-result XML so Sonar sees richer
  # signal than Automatic Analysis can derive from source alone. **Disable
  # Automatic Analysis in the SonarCloud UI** (Administration → Analysis
  # Method → "CI-based analysis") or this job conflicts with it and
  # SonarCloud fails the analysis with "You are running CI analysis while
  # Automatic Analysis is enabled."
  #
  # `sonar.qualitygate.wait=true` in sonar-project.properties makes this job
  # block on the Quality Gate verdict and exit with it, so the GHA job
  # conclusion IS the gate verdict (deterministic, in-pipeline). The external
  # "SonarCloud Code Analysis" check posted by the SonarCloud GitHub App over
  # webhook can race / temporarily disagree (#269); branch protection should
  # gate on this `SonarCloud analysis` job, not the webhook-posted check.
  # fan-in: informational — SonarCloud is advisory and intentionally NOT in
  # the `check` (CI gate) fan-in. Branch protection requires exactly "CI gate"
  # + "2 · Pre-merge PR gates (PR → main)"; SonarCloud is not a separately
  # required status context (the webhook-posted "SonarCloud Code Analysis"
  # check can race / temporarily disagree with this job — #269). The Sonar
  # per-file ratchet (check_sonar_new_code.py) is enforced locally via
  # safe-commit.sh: it compares the project's current per-file open-issue
  # counts against the committed baseline (.architecture/baseline/
  # sonar-per-file*.json) deterministically — no live leak period, no skip
  # flag (the KAIRIX_SKIP_SONAR_PARITY escape hatch was retired in #499
  # Phase 2). It is not gated through this job's pass/fail.
  #
  # New Code definition = PREVIOUS_VERSION (#547). The server-side "New
  # Code" window for main is set to "Previous version" (a one-time API
  # action; tooling at scripts/sonar/reset_new_code.py via the
  # 5b · SonarCloud new-code baseline reset workflow). This scan emits
  # `sonar.projectVersion` (below) so each release bumps the version and
  # rolls the leak period forward, instead of pre-existing debt drifting
  # back into the "new code" set and failing the gate on old code.
  # TODO(#499): confirm gating intent — the job header comment below still
  # reads "branch protection should gate on this job"; reconcile that with the
  # current branch-protection contexts before promoting Sonar to a hard gate.
  sonarcloud:
    name: "SonarCloud analysis"
    runs-on: ubuntu-latest
    needs: [changes, unit-and-type]
    if: needs.changes.outputs.python == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results-unit-3.12
        continue-on-error: true  # artifact missing on path-filtered runs; Sonar still scans without it

      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-data
        continue-on-error: true  # artifact missing on path-filtered runs; Sonar still scans without it

      - name: Derive project version for New Code boundary (#547)
        id: ver
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The version boundary that drives PREVIOUS_VERSION new-code mode.
          # setuptools-scm (the project's version source) resolves the nearest
          # tag + dev distance; on a tagged commit it is the clean release. We
          # fall back to `git describe` then the short SHA so the scan always
          # has a non-empty version.
          # F83: each capture is guarded with `|| VAR=""` so a transient
          # resolver failure leaves the var empty (we fall through to the next
          # source) rather than tripping errexit at the assignment (#483 class).
          VERSION=""
          VERSION="$(python3 -m setuptools_scm 2>/dev/null)" || VERSION=""
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --always 2>/dev/null)" || VERSION=""
          fi
          if [ -z "$VERSION" ]; then
            VERSION="${HEAD_SHA:0:12}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sonar.projectVersion = $VERSION"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # PREVIOUS_VERSION new-code boundary (#547) — bumps per release so
          # genuinely-old code drops out of the leak period.
          args: >
            -Dsonar.projectVersion=${{ steps.ver.outputs.version }}

  # ── Docker build verification ──────────────────────────────────────────────
  docker:
    name: "Docker build"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          tags: kairix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint python kairix:ci -c "import kairix; print('OK')"

      - name: Verify reference library in container
        run: |
          COUNT=$(docker run --rm --entrypoint sh kairix:ci -c "find /opt/kairix/reference-library -name '*.md' | wc -l")
          echo "Reference library docs: $COUNT"
          if [ "$COUNT" -lt 5000 ]; then
            echo "::error::Reference library has only $COUNT docs (expected 5800+)"
            exit 1
          fi
          docker run --rm --entrypoint sh kairix:ci -c "ls /opt/kairix/suites/*.yaml"

      - name: Image size gate (max 3GB)
        run: |
          SIZE_BYTES=$(docker image inspect kairix:ci --format '{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 3072 ]; then
            echo "::error::Docker image is ${SIZE_MB}MB — exceeds 3GB gate. Check for CUDA libs or unnecessary dependencies."
            exit 1
          fi

  # ── Fan-in gate (branch protection target) ─────────────────────────────────
  check:
    name: "CI gate"
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - arch-fitness
      - pre-commit
      - contracts
      - unit-and-type
      - coverage
      - integration
      - e2e-composed-path
      - union-coverage
      - security
      - docker
    permissions: {}
    steps:
      - name: Evaluate job results
        env:
          RESULT_ARCH: ${{ needs.arch-fitness.result }}
          RESULT_PRECOMMIT: ${{ needs.pre-commit.result }}
          RESULT_CONTRACTS: ${{ needs.contracts.result }}
          RESULT_UNIT: ${{ needs.unit-and-type.result }}
          RESULT_COVERAGE: ${{ needs.coverage.result }}
          RESULT_INTEGRATION: ${{ needs.integration.result }}
          RESULT_E2E: ${{ needs.e2e-composed-path.result }}
          RESULT_UNION: ${{ needs.union-coverage.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
          RESULT_DOCKER: ${{ needs.docker.result }}
        run: |
          echo "arch-fitness:  $RESULT_ARCH"
          echo "pre-commit:    $RESULT_PRECOMMIT"
          echo "contracts:     $RESULT_CONTRACTS"
          echo "unit-and-type: $RESULT_UNIT"
          echo "coverage:      $RESULT_COVERAGE"
          echo "integration:   $RESULT_INTEGRATION"
          echo "e2e-composed:  $RESULT_E2E"
          echo "union-cov:     $RESULT_UNION"
          echo "security:      $RESULT_SECURITY"
          echo "docker:        $RESULT_DOCKER"

          # Fail if any required job failed (skipped is OK -- path filter)
          for result in \
            "$RESULT_ARCH" \
            "$RESULT_PRECOMMIT" \
            "$RESULT_CONTRACTS" \
            "$RESULT_UNIT" \
            "$RESULT_INTEGRATION" \
            "$RESULT_E2E" \
            "$RESULT_UNION" \
            "$RESULT_SECURITY" \
            "$RESULT_DOCKER"; do
            # Note: RESULT_COVERAGE excluded from gate — coverage enforcement
            # is done by --cov-fail-under=80 in the unit test job and per-file
            # 85% floor (F7) inside arch-fitness. The coverage report action
            # only posts a PR comment (non-critical).
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "FAILED: at least one required job did not succeed ($result)"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
