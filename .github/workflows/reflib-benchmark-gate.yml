name: "1b · Reference library benchmark gate (retrieval loop)"

on:
  pull_request:
    paths:
      - "kairix/core/search/**"
      - "kairix/core/facts/**"
      - "kairix/quality/benchmark/**"
      - "kairix/quality/eval/**"
      - "kairix/knowledge/reflib/**"
      - "kairix/use_cases/eval_suite.py"
      - "suites/reflib-contract-suite.yaml"
      - "benchmark-results/reflib-contract-baseline.json"
      - "reference-library/**"

permissions:
  contents: read

jobs:
  reflib-benchmark-gate:
    name: Reference library contract suite
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install kairix
        run: pip install -e ".[dev]"

      - name: Run reflib contract suite (mock backend)
        run: python3 scripts/run-reflib-contract.py

      - name: Compare against baseline
        run: python3 scripts/compare-reflib-baseline.py

  # Plan B-parity Week 4 Stream A — conversation eval gate.
  #
  # Discovers every reference-library/conversations/engagement-*/ corpus
  # and runs `kairix eval <suite> --json` against it. When a pinned baseline
  # exists under reference-library/conversations/expected/<suite>.json,
  # asserts the run does not regress by more than 2pp (gate fails the PR).
  # When the baseline is a sentinel ({"baseline": "not-yet-measured"}),
  # the run is recorded but not gated — "establishing baseline" mode.
  conversation-eval-gate:
    name: Conversation eval suites (engagement-*)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install kairix
        run: pip install -e ".[dev]"

      - name: Eval conversation corpora
        run: bash scripts/ci/eval-conversation-corpora.sh

      - name: Upload per-corpus results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-eval-results
          path: /tmp/conversation-eval/
          if-no-files-found: warn
          retention-days: 14
