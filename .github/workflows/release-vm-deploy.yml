name: "2b · Release (VM alpha-deploy + reflib gate)"

# Phase 4 of #272. Closes the alpha-validation loop: when an alpha tag
# is cut, this workflow waits for docker-publish to finish, then deploys
# the alpha image to the Customer-Zero VM and validates it (onboard
# check + reflib benchmark) on the box itself.
#
# Deploy plane (2026-06 migration): the VM deploy now runs over the
# canonical tc-pipelines reusable workflow `azure-vm-deploy.yml@v1`
# (WIF login -> [disk snapshot, skipped for kairix] -> `az vm run-command`
# the apply script -> smoke `systemctl is-active`), replacing the bespoke
# HMAC-webhook POST. Snapshot is skipped (skip-snapshot: 'true') because the
# kairix CI identity lacks Disk Snapshot Contributor; rollback is by
# re-pinning the previous KAIRIX_IMAGE_TAG, not a disk snapshot.
# The box-side apply logic lives in scripts/deploy/apply-alpha.sh, which
# faithfully replicates the (retained, fallback) Go webhook's deploy.go.
# This is the "canonical in tc-pipelines, don't reinvent" pattern: WIF +
# the shared deploy workflow, no kairix-stored HMAC/CF secrets.
#
# All untrusted inputs (inputs.tag, github.event.release.tag_name) are
# bound to env: variables before being used in run: scripts, per the
# workflow-injection guidance in
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Alpha tag to validate (e.g. v2026.5.16a1)'
        required: true
        type: string
  release:
    types: [prereleased]

permissions:
  contents: read
  id-token: write  # WIF: the reusable deploy workflow federates to Azure

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gate-alpha-tag:
    name: Gate — alpha tag only
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease)
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve tag + SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${DISPATCH_TAG:-$RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::no tag resolved from inputs.tag or release.tag_name"
            echo "fix: invoke via workflow_dispatch with -f tag=vYYYY.M.DaN, or wait for a real prerelease event"
            exit 1
          fi
          if ! echo "$TAG" | grep -Eq 'a[0-9]+$'; then
            echo "::error::tag '$TAG' is not an alpha tag (must end with aN). Refusing to deploy."
            echo "fix: only invoke this workflow for alpha tags (release-alpha.yml output)."
            exit 1
          fi
          SHA=$(gh api "repos/${REPO}/git/refs/tags/$TAG" --jq '.object.sha')
          if [ -z "$SHA" ]; then
            echo "::error::could not resolve SHA for tag $TAG"
            exit 1
          fi
          OBJECT_TYPE=$(gh api "repos/${REPO}/git/refs/tags/$TAG" --jq '.object.type')
          if [ "$OBJECT_TYPE" = "tag" ]; then
            SHA=$(gh api "repos/${REPO}/git/tags/$SHA" --jq '.object.sha')
          fi
          echo "tag=$TAG"  >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"  >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> $SHA"

  wait-for-image:
    # Probe the actual artifact (the GHCR image manifest for the tag)
    # rather than tracking the docker-publish workflow run. The run's
    # display_title doesn't include the tag, and the dispatch-inputs
    # aren't easily filterable via the API — checking the registry is
    # both more reliable and self-evident (presence of the image is
    # what 'docker compose pull' on the VM actually needs).
    name: Wait — GHCR image manifest published
    runs-on: ubuntu-latest
    needs: gate-alpha-tag
    steps:
      - name: Poll GHCR for the alpha image manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate-alpha-tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # GHCR anonymous-access pattern: request a token first, then
          # use it to ask for the manifest. Anonymous pull is allowed for
          # public packages; we still need the token-handshake step.
          # The Authorization on the token call is a base64 of the
          # GH_TOKEN — but for anonymous pull we send no creds.
          # The image tag has no leading 'v' (see docker-publish.yml — it
          # strips the 'v' when computing the GHCR tag). The git tag is
          # vYYYY.M.D[.N]aN; the image tag is YYYY.M.D[.N]aN.
          IMAGE_TAG="${TAG#v}"
          deadline=$(( $(date +%s) + 1800 ))
          manifest_url="https://ghcr.io/v2/${REPO}/manifests/${IMAGE_TAG}"
          token_url="https://ghcr.io/token?scope=repository:${REPO}:pull&service=ghcr.io"
          while [ "$(date +%s)" -lt "$deadline" ]; do
            token=$(curl -fsSL "$token_url" | jq -r '.token // empty')
            if [ -z "$token" ]; then
              echo "could not obtain anonymous GHCR token; sleeping 15s"
              sleep 15
              continue
            fi
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              "$manifest_url")
            echo "manifest probe $manifest_url -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "::notice::GHCR has $TAG — proceeding to deploy"
              exit 0
            fi
            sleep 15
          done
          echo "::error::timed out waiting for GHCR manifest at $manifest_url (30 min)"
          echo "fix: check the docker-publish workflow run for $TAG"
          exit 1

  prep:
    # Deliver the box-side apply-script to the VM at deploy time. The kairix
    # repo is NOT checked out on vm-openclaw (kairix deploys as a container
    # image), so /opt/kairix/app/scripts/... doesn't exist on the box. To keep
    # scripts/deploy/apply-alpha.sh as the SINGLE source of truth (one tested
    # copy) rather than inline-duplicating its ~190 lines, base64-encode it
    # here and pass it to deploy-vm, which decodes + runs it via run-command.
    name: Prep — encode apply-script for delivery
    runs-on: ubuntu-latest
    needs: gate-alpha-tag
    outputs:
      script_b64: ${{ steps.encode.outputs.script_b64 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Base64-encode apply-alpha.sh
        id: encode
        run: |
          set -euo pipefail
          echo "script_b64=$(base64 -w0 scripts/deploy/apply-alpha.sh)" >> "$GITHUB_OUTPUT"

  deploy-vm:
    name: Deploy + validate alpha on VM (WIF → snapshot → apply → smoke)
    needs: [gate-alpha-tag, wait-for-image, prep]
    permissions:
      contents: read
      id-token: write
    # NOTE on the `vm-deploy` environment (retired by this migration): the
    # job-level `environment:` was removed because GitHub Actions does NOT
    # permit it on a job that calls a reusable workflow (`uses:`) — actionlint
    # rejects it. The `vm-deploy` environment had NO required reviewers (only a
    # branch policy), so removing it loses no approval gate. The now-orphaned
    # `vm-deploy` environment and its secrets (CF_ACCESS_CLIENT_ID,
    # CF_ACCESS_CLIENT_SECRET, VM_WEBHOOK_SECRET, KAIRIX_WEBHOOK_URL) are no
    # longer referenced and can be deleted from repo settings by a human.
    # Canonical tc-pipelines deploy: WIF Azure login → OS-disk snapshot →
    # `az vm run-command` the apply-script → smoke `systemctl is-active`.
    # Replaces the bespoke HMAC-webhook POST + commit-status poll.
    uses: three-cubes/tc-pipelines/.github/workflows/azure-vm-deploy.yml@v1
    with:
      resource-group: RG-AGENTS-CORE
      op-tag: kairix-alpha
      # skip-snapshot: the kairix CI identity holds VM Contributor but NOT Disk Snapshot Contributor — kairix rolls back by re-pinning the previous image tag (KAIRIX_IMAGE_TAG), not a VM disk snapshot, so the snapshot step is intentionally skipped.
      skip-snapshot: 'true'
      # The apply-script is delivered inline (the repo is not checked out on
      # the box): the prep job base64-encodes scripts/deploy/apply-alpha.sh and
      # we decode + run it here. apply-alpha.sh takes the tag as $1 and strips
      # any leading 'v' to the GHCR image-tag convention; it is self-contained
      # (cd's only to the on-box /opt/kairix/app compose dir, no repo paths).
      targets: |
        - vm-name: vm-openclaw
          apply-script: |
            set -eu
            printf %s '${{ needs.prep.outputs.script_b64 }}' | base64 -d > /tmp/apply-alpha.sh
            sh /tmp/apply-alpha.sh '${{ needs.gate-alpha-tag.outputs.tag }}'
          smoke-units: 'kairix.service'
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets: inherit  # pragma: allowlist secret — passes the caller's AZURE_* repo vars to the reusable workflow; no literal secret here
