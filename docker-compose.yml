# Kairix — Docker Compose stack (laptop / single-VM first)
#
# This base file reads a plain `.env` next to it. VM deploys that feed
# secrets through a /run/secrets/kairix.env sidecar keep that wiring in
# their own compose file or override (see docker/README.md) — it is kept
# out of this base file so a fresh machine never fails on a file it
# doesn't have.
#
# Quick start:
#   1. git clone https://github.com/three-cubes/kairix && cd kairix
#      (or download docker-compose.yml, .env.example, kairix.config.example.yaml)
#   2. cp .env.example .env
#      Then edit .env: add your LLM API key (KAIRIX_PROVIDER_LLM_*).
#   3. cp kairix.config.example.yaml kairix.config.yaml
#      Copy it BEFORE step 5 — compose bind-mounts this file, and docker
#      replaces a missing bind source with an empty directory.
#   4. ln -s /path/to/your/documents ./documents
#      For agent memory (kairix remember / memory_write), also:
#        mkdir -p documents/04-Agent-Knowledge
#        sudo chown -R 995:985 documents/04-Agent-Knowledge
#   5. docker compose up -d
#   6. docker compose exec kairix kairix embed
#   7. docker compose exec kairix kairix onboard check
#
# Services (Plan 2 — unified container):
#   kairix — one container runs both the MCP api process AND the worker process
#            as supervised siblings via s6-overlay. `docker compose ps` now
#            shows 2 services (was 3) — `kairix-worker` is gone; its workload
#            and memory budget folded into the unified `kairix` service.
#   neo4j  — knowledge graph for people / company / relationship queries.

services:
  kairix:
    image: ghcr.io/three-cubes/kairix:${KAIRIX_IMAGE_TAG:-main}
    container_name: app-kairix-1
    restart: unless-stopped
    ports:
      # Bound to localhost only by default — kairix has no auth.
      #
      # KAIRIX_MCP_BIND_HOST overrides the bind host. Set to ``0.0.0.0`` in
      # your ``.env`` ONLY if you've put the MCP behind an auth-enforcing
      # reverse proxy (caddy / nginx / Authentik) or sit on a private VM
      # network. KAIRIX_HOST_PORT moves the host-side port (default 8080)
      # when another service already owns it. The env-var indirection means
      # both overrides survive every ``git pull`` / image refresh — no need
      # to re-patch docker-compose.yml after upgrades.
      - "${KAIRIX_MCP_BIND_HOST:-127.0.0.1}:${KAIRIX_HOST_PORT:-8080}:8080"
    environment:
      # The image bakes KAIRIX_DOCUMENT_ROOT=/var/lib/kairix/documents.
      # Point it at the ./documents bind mount below so `kairix embed`
      # sees your files.
      KAIRIX_DOCUMENT_ROOT: /data/documents
      # Reach the bundled neo4j service by its compose DNS name.
      KAIRIX_NEO4J_URI: bolt://neo4j:7687
      # Setup-wizard + CLI config writes land on the data volume — your
      # kairix.config.yaml mount below stays read-only and pristine.
      KAIRIX_CONFIG_OVERLAY_PATH: /var/lib/kairix/kairix.config.local.yaml
      # Fresh-install corpora are small, so in-process vec-index writes are
      # safe and give the wizard's indexing run vector search out of the box.
      # At large scale (>= ~1M vectors) remove this and schedule
      # `kairix index-rebuild` instead (see #335 and the
      # worker_writes_vec_index docstring in kairix/paths.py).
      KAIRIX_WORKER_WRITES_VEC_INDEX: "1"
      # KAIRIX_SECRETS_FILE is left at the image default — secrets arrive
      # through env_file: .env on this path.
    volumes:
      - kairix-data:/var/lib/kairix
      - kairix-cache:/var/cache/kairix
      - ./documents:/data/documents:ro  # Your documents folder → container's document store (read-only)
      # Agent memory subtree — the one place kairix itself writes
      # (kairix remember / the memory_write MCP tool). Create it before
      # `up -d` so docker doesn't auto-create it root-owned:
      #   mkdir -p documents/04-Agent-Knowledge
      #   sudo chown -R 995:985 documents/04-Agent-Knowledge
      - ./documents/04-Agent-Knowledge:/data/documents/04-Agent-Knowledge
      # Collections + agents config. Copy kairix.config.example.yaml to
      # kairix.config.yaml before `up -d` (quick-start step 3).
      - ./kairix.config.yaml:/etc/kairix/kairix.config.yaml:ro
    env_file:
      - .env
    depends_on:
      neo4j:
        condition: service_healthy
    # Healthcheck hits the readiness endpoint that the supervised api
    # process serves on port 8080. start_period generous so the initial
    # warm (s6 cont-init scripts, first-boot kairix init --user if the
    # data volume is empty, then the api + worker services starting) is
    # treated as "starting" rather than "unhealthy".
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Resource limits — sized for a 4-vCPU / 8-GiB host (smallest deployment
    # we test against). 4g folds in what was previously kairix (3g) +
    # kairix-worker (1g) = 4g combined. Both processes now share this cap
    # under s6 supervision inside the same container.
    deploy:
      resources:
        limits:
          memory: 4g

  neo4j:
    image: neo4j:5-community
    # Pin for production: neo4j:5.24.0-community
    environment:
      NEO4J_AUTH: neo4j/${KAIRIX_NEO4J_PASSWORD}
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${KAIRIX_NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Uncomment to expose Neo4j browser (http://localhost:7474):
    # ports:
    #   - "7474:7474"
    #   - "7687:7687"
    # Neo4j heap is configured via NEO4J_server_memory_heap_max_size (set
    # via env var if you tune it). Container hard cap below provides a
    # backstop so a runaway neo4j can't OOM the host.
    mem_limit: ${KAIRIX_NEO4J_MEM_LIMIT:-2g}
    mem_reservation: ${KAIRIX_NEO4J_MEM_RESERVATION:-512m}
    cpus: ${KAIRIX_NEO4J_CPUS:-0.75}
    blkio_config:
      weight: 500

volumes:
  kairix-data:
  kairix-cache:
  neo4j-data:
