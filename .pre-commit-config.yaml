# Pre-commit hooks -- run locally and in CI via pre-commit/action@v3.0.1
# Install: pre-commit install
# Run all: pre-commit run --all-files

# Global exclude: reference library is external open-source content — not ours to lint
exclude: ^reference-library/

repos:
  # ── Ruff (lint + isort + format — replaces black, isort, flake8) ───────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]

  # ── Secret detection ───────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  # ── GitHub Actions workflow lint ────────────────────────────────────────────
  # Catches the parse-error class that previously cost a four-commit CI cycle:
  # literal ${{ }} inside shell comments, undefined needs.* refs, action SHAs
  # that don't exist, matrix-with-empty-list etc. Runs only when workflow
  # files are staged.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.ya?ml$

  # ── Architecture fitness functions ─────────────────────────────────────────
  # Single catalogue-driven hook (EPIC #499 Phase 2). The individual
  # F-rules are no longer enumerated here — scripts/checks/_rule_catalogue.py
  # is the single source of truth, and scripts/checks/run_checks.py reads it
  # and dispatches every ACTIVE rule whose scope intersects the staged
  # paths. Each check fails the commit on net-new violations; pre-existing
  # files are grandfathered via .architecture/baseline/ and the baseline is
  # expected to shrink over time. See docs/architecture/fitness-functions.md.
  #
  # Adding a fitness rule is now ONE RuleEntry row + its check script + its
  # baseline — no edit to this file is needed for the rule to gate at
  # pre-commit.
  - repo: local
    hooks:
      - id: arch-fitness-catalogue
        name: "arch: catalogue-driven fitness functions (staged scope)"
        entry: python3 scripts/checks/run_checks.py --staged --skip-coverage
        language: system
        pass_filenames: false
        always_run: true
