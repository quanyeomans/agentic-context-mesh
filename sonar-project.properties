sonar.projectKey=three-cubes_kairix
sonar.organization=three-cubes

sonar.sources=kairix/
sonar.tests=tests/
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# Exclude reference library (third-party content) and test fixtures
sonar.exclusions=reference-library/**,tests/integration/reflib_fixture/**

# Quality gate thresholds
sonar.cpd.minimumTokens=50

# CPD (Copy-Paste Detector) exclusions. Two paths exempt by design:
#
# - kairix/providers/**: every plugin MUST implement the same ``Provider``
#   Protocol (embed_batch / chat / dimension / healthcheck), AND every
#   plugin's provider.py owns its own httpx call shape, error-mapping, and
#   header-builder — structurally similar by design because each must
#   marshal the same shape of request/response. F27 forbids cross-plugin
#   imports so the duplication cannot be flattened by extracting to a
#   shared base class; the only legal shared surface is kairix/providers/_base.py
#   (Protocol + shared error types), which is already used. See
#   docs/architecture/provider-plugin-architecture.md. Per-provider dup
#   on the v2026.5.17 alpha: 610 lines across 4 providers (azure_foundry 106,
#   openai 196, azure_legacy 140, litellm_proxy 168) — Sonar counted these
#   as "duplicated" but each is its own canonical implementation of the
#   plugin contract for its endpoint shape.
#
# - tests/bdd/steps/**: pytest-bdd's step decorators register parsers by
#   match-string; multiple step files declaring near-identical step strings
#   ("the agent embeds the text \"{text}\"") are the BDD feature contract
#   being shared across journeys, not duplicated code. The step IMPLEMENTATIONS
#   are scenario-specific.
sonar.cpd.exclusions=kairix/providers/**,tests/bdd/steps/**,kairix/install/init_cli.py,kairix/install/uninstall_cli.py

# Plan 1 install CLI wrappers (kairix init / uninstall) — same exemption shape
# as kairix/knowledge/reflib/cli.py: argparse front-doors with no business
# logic; tested by integration outcome tests (tests/integration/test_cli_init.py
# + test_cli_uninstall.py) and BDD (tests/bdd/test_install_*_mode.py), not by
# unit tests. The argparse shape is naturally duplicated across init + uninstall
# (--system / --user / --json mutually-exclusive guard).
sonar.coverage.exclusions=kairix/install/init_cli.py,kairix/install/uninstall_cli.py

# Make the in-CI scanner step block until the Quality Gate has been evaluated
# server-side, and exit with the gate's verdict. Without this, the scanner
# returns as soon as the report upload succeeds — before the gate runs —
# and the GHA job conclusion has no relationship to the gate result. The
# external "SonarCloud Code Analysis" GitHub Check (posted asynchronously
# by the SonarCloud GitHub App via webhook) then races: it can post FAILURE
# while the Quality Gate API reports OK, requiring manual reruns to refresh
# (#269 — observed on PRs #247, #264, #265). With wait=true, the in-workflow
# "SonarCloud analysis" job is authoritative and deterministic; branch
# protection should gate on that job rather than the webhook-posted check.
sonar.qualitygate.wait=true

# ----------------------------------------------------------------------------
# Issue exclusions — version-controlled mirror of the rules silenced where
# they're false-positive prone for kairix's shape. Same exclusions configured
# in the SonarCloud UI; this file makes them PR-reviewable and survives a
# project rebuild. UI entries can be removed once this lands.
#
# Each entry has a rationale; review during quality-gate audits.
# ----------------------------------------------------------------------------

sonar.issue.ignore.multicriteria=tests-creds,tests-perms,benchmark-log,monitor-log,scripts-paths,onboard-cli-paths,connect-store-paths,connect-localhost-http,tests-reraise,tests-tmp-writable,tests-camelcase,tests-type-misuse,worker-reraise,tests-commented-code,tests-string-dupes,scripts-string-dupes,fakes-protocol-args,fixtures-protocol-args,starlette-async-handlers,list-mutation-snapshots,py312-generics,py312-generic-functions,quality-prng-sampling,wikilinks-prng-audit,regex-bounded-vault-content,dispatch-cognitive-complexity,embed-parallel-params,xdg-runtime-tmp-fallback,secrets-store-paths

# python:S2068 — Hard-coded credentials. Test fixtures use literal "test"
# passwords because the connection is to a fake or in-memory backend; no
# real production secret is involved. The rule stays active for production
# code (it would still fire on a literal password in kairix/secrets.py).
# Pattern uses ``tests/**`` (not ``tests/**/*``) so it also matches top-level
# fixtures like ``tests/test_credentials.py`` and ``tests/test_secrets.py``.
sonar.issue.ignore.multicriteria.tests-creds.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.tests-creds.resourceKey=tests/**

# python:S2612 — File permissions. Kairix only sets 0o644 (read-by-all,
# write-by-owner) and 0o600 (secrets file). Both are standard; the rule
# fires regardless of mode value. Tests exercise chmod paths to verify
# the secrets module's permission handling — that's the point.
sonar.issue.ignore.multicriteria.tests-perms.ruleKey=python:S2612
sonar.issue.ignore.multicriteria.tests-perms.resourceKey=tests/**

# pythonsecurity:S5145 — Logging user-controlled data. The benchmark
# baseline logs its own comparison summary lines; the eval monitor logs
# OS-error exception classes. Neither carries agent/user input. The rule
# stays active for kairix/agents/** where MCP tool args ARE user-
# controlled and could legitimately flow into logs.
sonar.issue.ignore.multicriteria.benchmark-log.ruleKey=pythonsecurity:S5145
sonar.issue.ignore.multicriteria.benchmark-log.resourceKey=kairix/quality/**/*

# pythonsecurity:S5145 — Same rationale as benchmark-log above; the eval
# monitor's log call site has the identical no-agent/no-user-input shape
# (OS-error exception class only), narrowed to the single monitor.py file.
sonar.issue.ignore.multicriteria.monitor-log.ruleKey=pythonsecurity:S5145
sonar.issue.ignore.multicriteria.monitor-log.resourceKey=kairix/quality/eval/monitor.py

# pythonsecurity:S2083 — Path traversal. The kairix CLI runs with the
# calling user's filesystem permissions and operates inside the local-
# process trust model; --output PATH is the trust boundary itself. Same
# argument applies to operator scripts under scripts/. The rule stays
# active for kairix/agents/** (server-mode code paths).
sonar.issue.ignore.multicriteria.scripts-paths.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.scripts-paths.resourceKey=scripts/**/*

# pythonsecurity:S2083 — Path traversal. Same trust-boundary rationale as
# scripts-paths above. ``kairix onboard guide`` writes the bundled agent
# usage guide markdown into the operator's declared --document-root (or
# --output override). Both flags are the operator's explicit CLI trust
# boundary — the kairix CLI runs with the calling user's filesystem
# permissions and the operator can already write anywhere their account
# permits via shell redirection. ``_resolve_guide_dest`` canonicalises
# every returned path through ``Path.expanduser().resolve()`` so the
# eventual write target is in canonical form before the OS-level call.
# Sonar's Python taint analyser does not accept ``.resolve()`` alone as a
# sanitiser, hence this explicit exclusion (matches the eval/cli.py /
# scripts/** precedent). The rule stays active for ``kairix/agents/**``
# (server-mode code paths) and every other module.
sonar.issue.ignore.multicriteria.onboard-cli-paths.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.onboard-cli-paths.resourceKey=kairix/platform/onboard/cli.py

# pythonsecurity:S2083 — Path traversal. ``kairix.connect.store.file_store``
# writes captured OAuth tokens to the operator's chosen --secrets-file path
# (or $KAIRIX_SECRETS_FILE, or the canonical ``<home>/.config/kairix/secrets/
# kairix.env`` default). Every branch routes through ``_resolve_path()`` →
# ``_confine_to_allowed_root()`` which canonicalises via
# ``Path.expanduser().resolve()`` and verifies the result sits under one of
# ``{home, /etc/kairix, tempfile.gettempdir()}``. Escape raises ``ValueError``
# before any write. The confinement contract is pinned by
# ``tests/unit/test_connect_store_file.py::test_*_escape_outside_allowed_roots_raises``
# (3 tests, sabotage-proven in commit db3d8f1e). Sonar's Python taint analyser
# does not recognise the allow-list sanitiser pattern (it's not in its
# built-in sink list), hence this explicit exclusion. Matches the
# scripts-paths + onboard-cli-paths precedent above.
sonar.issue.ignore.multicriteria.connect-store-paths.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.connect-store-paths.resourceKey=kairix/connect/store/file_store.py

# pythonsecurity:S2083 — Path traversal. ``kairix.secrets.store.set_secret``
# writes the operator's secrets bundle to $KAIRIX_SECRETS_FILE / the
# canonical container + XDG defaults — the same operator-owned trust
# boundary as connect-store-paths above. Every write routes through
# ``_confine_to_allowed_root()`` which canonicalises via
# ``Path.expanduser().resolve()`` and verifies the result sits under one of
# ``{home, /etc/kairix, /run/secrets, /run/kairix, tempfile.gettempdir()}``;
# escape raises ValueError before any filesystem mutation. Contract pinned by
# ``tests/unit/test_secrets_store.py::test_set_secret_rejects_bundle_path_outside_allowed_roots``
# + ``::test_set_secret_env_override_outside_allowed_roots_rejected``
# (sabotage-proven: guard removed -> both FAILED -> restored). Sonar's taint
# analyser does not recognise the allow-list sanitiser, hence this exclusion.
sonar.issue.ignore.multicriteria.secrets-store-paths.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.secrets-store-paths.resourceKey=kairix/secrets/store.py

# python:S5332 — "Using http protocol is insecure. Use https instead."
# The OAuth2 loopback redirect flow (RFC 8252 §7.3) REQUIRES http on the
# 127.0.0.1 loopback address — most identity providers (Google, Slack,
# Azure, Anthropic) reject the redirect_uri otherwise. Self-signed https
# on localhost forces operators to install certs, and OAuth providers
# typically don't accept self-signed regardless. The relevant URLs are
# always http://127.0.0.1:<port>/oauth2callback — never traverse a
# network — so the rule's threat model (eavesdroppable HTTP over a wire)
# does not apply. Two production sites flagged:
#   * kairix/connect/cli.py — operator-facing summary message that
#     prints the localhost callback URL
#   * kairix/connect/listener.py — the LocalhostCallbackListener bind
#     address + redirect_uri property (RFC 8252 contract)
# Both are loopback-only — the listener literally binds 127.0.0.1.
sonar.issue.ignore.multicriteria.connect-localhost-http.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.connect-localhost-http.resourceKey=kairix/connect/**/*

# python:S5754 — "Reraise this exception to stop the application as the user expects."
# CLI test helpers in tests/**/test_cli*.py legitimately catch ``SystemExit`` to
# extract the exit code from ``cli.main()`` (which calls ``sys.exit()``). Re-raising
# would defeat the test pattern. The rule stays active for production code, where
# a swallowed exception would be a real bug.
sonar.issue.ignore.multicriteria.tests-reraise.ruleKey=python:S5754
sonar.issue.ignore.multicriteria.tests-reraise.resourceKey=tests/**

# python:S5443 — "Make sure publicly writable directories are used safely here."
# Test fixtures use pytest's ``tmp_path`` (per-test isolated directory under the
# user's pytest tmpdir root, typically /tmp/pytest-of-<user>/) and occasionally
# literal /tmp paths for staging — never a real shared-tenancy host. The fixture
# is isolated per test, cleaned by pytest, and never touches production data.
# Pattern uses ``tests/**`` (not ``tests/**/*``) so it also matches top-level
# files like ``tests/test_worker.py`` that exercise tmp-path fixtures directly.
sonar.issue.ignore.multicriteria.tests-tmp-writable.ruleKey=python:S5443
sonar.issue.ignore.multicriteria.tests-tmp-writable.resourceKey=tests/**

# python:S100 — Method name doesn't match snake_case regex.
# tests/plugins/test_kairix_memory_prompt.py mocks the openclaw plugin API which
# uses camelCase by external convention (``appendSystemContext``). Renaming the
# fake's method to snake_case would break the contract the real openclaw
# loader expects from a plugin.
sonar.issue.ignore.multicriteria.tests-camelcase.ruleKey=python:S100
sonar.issue.ignore.multicriteria.tests-camelcase.resourceKey=tests/plugins/**

# python:S5655 — "Function expects a different type." Tests in
# tests/temporal/test_rewriter.py, tests/temporal/test_index.py, and
# tests/embed/test_embed_coverage.py deliberately pass type-mismatched
# arguments (``None``, ints, sketchy ``__format__`` objects) to exercise
# the production code's outer ``try/except`` branches. These are
# defensive-path tests — the API contract is "never raises on bad input,
# returns the documented fallback" — and the only way to drive the branch
# is to actually hand the function bad input. Each call is marked with
# ``# type: ignore[arg-type]`` so mypy still flags accidental misuse in
# non-test code. The rule stays active for production code, where a
# type-mismatch is a real bug.
sonar.issue.ignore.multicriteria.tests-type-misuse.ruleKey=python:S5655
sonar.issue.ignore.multicriteria.tests-type-misuse.resourceKey=tests/**

# python:S5754 — Same "swallow SystemExit on purpose" pattern as the test
# helpers, but in production: ``kairix/worker.py`` deliberately catches
# ``(Exception, SystemExit)`` around embed and wikilinks-inject so a recall
# gate alert (or any other ``sys.exit(1)`` inside a use case) does NOT kill
# the worker process. The worker's job is to KEEP RUNNING on its schedule;
# the use case's job is to do the work and report what happened (#224 +
# pre-v2026.5.10 worker fix). Re-raising would re-introduce the regression.
sonar.issue.ignore.multicriteria.worker-reraise.ruleKey=python:S5754
sonar.issue.ignore.multicriteria.worker-reraise.resourceKey=kairix/worker.py

# python:S125 — "Remove this commented out code." All flagged sites in tests
# are explanatory comments (test-data semantics, expected weighted-total
# arithmetic, section dividers, fixture annotations), not dead code. The
# rule has a known high false-positive rate against test files that lean on
# inline comments to document data shape; suppressing tests-wide keeps the
# rule active on production code (where commented-out code is a real smell).
sonar.issue.ignore.multicriteria.tests-commented-code.ruleKey=python:S125
sonar.issue.ignore.multicriteria.tests-commented-code.resourceKey=tests/**/*

# python:S1192 — "Define a constant for this duplicated literal." Test
# fixtures legitimately repeat string literals across independent test
# cases (e.g. ``"CONTRIBUTING.md"`` as a sample filename, ``"test question"``
# as a sample query) — each occurrence is a distinct test fact, not a
# duplicated production constant. Extracting a module-level constant
# would couple unrelated tests through a shared name and obscure the
# per-test intent.
sonar.issue.ignore.multicriteria.tests-string-dupes.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.tests-string-dupes.resourceKey=tests/**/*

# python:S1192 — ``scripts/sonar/triage_hotspots.py`` defines rationales
# keyed by ``(rule_id, file_path)`` tuples; the rule id appears as a dict
# key for every file it covers (e.g. ``"python:S5852"`` x10, ``"python:S2245"``
# x4). Extracting to a constant would obscure the keys at the use site —
# the rule id IS the key, not a duplicated literal.
sonar.issue.ignore.multicriteria.scripts-string-dupes.ruleKey=python:S1192
sonar.issue.ignore.multicriteria.scripts-string-dupes.resourceKey=scripts/sonar/**/*

# python:S1172 — "Remove the unused function parameter." ``tests/fakes.py``
# implements every kairix domain Protocol (Classifier, VectorSearch, Boost,
# Scorer, SearchLogger, …) for test injection. Many Protocol methods
# accept parameters that some fake implementations don't need (e.g. a
# ``NoopBoost.boost()`` ignores ``query`` and ``context``). The fakes
# MUST keep the exact Protocol signature so ``isinstance(fake, Protocol)``
# succeeds and so callers can swap fakes 1:1 with real implementations.
# Underscore-prefixing every Protocol param across fakes.py would couple
# the test fakes to internal naming conventions and obscure the
# Protocol-shaped intent.
sonar.issue.ignore.multicriteria.fakes-protocol-args.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.fakes-protocol-args.resourceKey=tests/fakes.py

# python:S1172 — Same rationale as fakes-protocol-args, but for the Neo4j
# mock fixture (tests/fixtures/neo4j_mock.py). The mock implements the
# ``Neo4jClient`` API surface that kairix calls; unused params in helper
# methods are kept for signature parity with the real client so the mock
# is a drop-in replacement.
sonar.issue.ignore.multicriteria.fixtures-protocol-args.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.fixtures-protocol-args.resourceKey=tests/fixtures/**/*

# python:S7503 — "Use asynchronous features in this function or remove the
# async keyword." Starlette HTTP route handlers MUST be ``async def`` even
# when the handler body is purely synchronous — the framework awaits them
# unconditionally. ``kairix/agents/mcp/transport.py`` and its test
# composition harness both define such handlers; removing ``async`` would
# break the route contract. Narrow scope to the two files that compose
# Starlette routes.
sonar.issue.ignore.multicriteria.starlette-async-handlers.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.starlette-async-handlers.resourceKey=**/mcp/transport.py,**/mcp/test_transport_composition.py

# python:S7504 — "Remove this unnecessary list() call on an already
# iterable object." ``tests/test_init.py:_restore_kairix_modules`` and
# ``scripts/checks/merge_coverage_xml.py`` both iterate over a collection
# WHILE mutating it (popping items / removing elements). The ``list(...)``
# snapshot is load-bearing — removing it raises ``RuntimeError: dictionary
# changed size during iteration`` (or silently skips elements in lxml).
# Sonar's static check can't tell the iteration mutates its target.
sonar.issue.ignore.multicriteria.list-mutation-snapshots.ruleKey=python:S7504
sonar.issue.ignore.multicriteria.list-mutation-snapshots.resourceKey=tests/test_init.py,scripts/checks/merge_coverage_xml.py

# python:S6792 — "Use the 'type' parameter syntax to declare this generic
# class." PEP 695 type-parameter syntax (``class Foo[T]:``) was introduced
# in Python 3.12. ``pyproject.toml`` pins ``requires-python = ">=3.10"`` so
# the package must remain importable on 3.10 and 3.11, where the PEP 695
# form is a syntax error. ``typing.Generic[T]`` is the only portable
# declaration across all supported versions; switching would either drop
# 3.10/3.11 support or fork the source. Re-evaluate when the floor moves
# to >=3.12.
sonar.issue.ignore.multicriteria.py312-generics.ruleKey=python:S6792
sonar.issue.ignore.multicriteria.py312-generics.resourceKey=kairix/**/*

# python:S6796 — "Use a generic type parameter for this function instead of a
# TypeVar." Same root constraint as S6792 above: PEP 695 function-level
# generic syntax (``def with_retry[T](...)``) was introduced in Python 3.12.
# pyproject.toml pins ``requires-python = ">=3.10"`` so 3.10/3.11 must remain
# importable, and the PEP 695 form is a SyntaxError on those interpreters.
# typing.TypeVar at module scope is the only portable declaration. Re-evaluate
# when the Python floor moves to >=3.12.
sonar.issue.ignore.multicriteria.py312-generic-functions.ruleKey=python:S6796
sonar.issue.ignore.multicriteria.py312-generic-functions.resourceKey=kairix/**/*

# python:S2245 (kairix/quality/**) — "Make sure that using this pseudorandom
# number generator is safe here." All ``random.*`` calls under kairix/quality/
# drive non-cryptographic uses: query sampling, eval test-data shuffling,
# probe sampler seeds. They are never used to generate session tokens,
# passwords, or any key material. ``secrets.SystemRandom`` would add no
# security benefit and would obscure the operator-facing seed contract
# (probe runs are reproducible by ``--seed N``; SystemRandom is unseedable).
sonar.issue.ignore.multicriteria.quality-prng-sampling.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.quality-prng-sampling.resourceKey=kairix/quality/**/*

# python:S2245 (kairix/knowledge/wikilinks/audit.py) — Same non-crypto use
# case: the audit's random suffix on temp filenames is collision-avoidance,
# not authentication. The audit never publishes the name to an untrusted
# party. Cryptographic strength here would add cost with no benefit.
sonar.issue.ignore.multicriteria.wikilinks-prng-audit.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.wikilinks-prng-audit.resourceKey=kairix/knowledge/wikilinks/audit.py

# python:S5852 (knowledge + text parsing) — "Make sure the regex used here,
# which is vulnerable to polynomial runtime due to backtracking, cannot
# lead to denial of service." All flagged regexes parse vault content
# (markdown frontmatter, wikilinks, entity overrides, splitter chunking)
# or text utilities operating on already-bounded inputs (kairix.text's
# ``estimate_tokens`` and snippet trimming).
#
# Two structural mitigations make catastrophic backtracking unreachable:
#   1. Input source: vault files are operator-authored knowledge content,
#      not untrusted user input over a network. The threat model is
#      malformed-but-benign markdown, not adversarial regex DoS attacks.
#   2. Input bounds: each call site applies a length cap before the regex
#      runs (snippet ≤500 chars, frontmatter block bounded by ``---``
#      delimiters, wikilink scan bounded by chunk_size). Polynomial blow-up
#      cannot exceed O(N²) on inputs ≤ a few KB.
#
# Switching to atomic groups (re2) is not portable across Python's
# stdlib ``re`` module; the ``regex`` package would add a hot-path
# dependency. Re-evaluate if any of these regexes start consuming
# unbounded operator-supplied input from a remote source.
sonar.issue.ignore.multicriteria.regex-bounded-vault-content.ruleKey=python:S5852
sonar.issue.ignore.multicriteria.regex-bounded-vault-content.resourceKey=kairix/**/*

# python:S3776 (kairix/core/queue/dispatch.py — dispatch_or_queue) —
# Cognitive complexity 18 vs ceiling 15. dispatch_or_queue is the
# decorator surface for the ADR-029 dispatch-or-queue contract. Its
# wrapper is a state-machine over four call-paths (dedup short-circuit /
# sync_only / async-under-budget / async-handoff-on-timeout) and every
# branch is load-bearing. Extracting a helper was tried but dropped
# per-file coverage from ~91% to 89.9% (below the F7 90% floor) because
# the helper isn't directly tested by the existing contract suite. The
# right paydown is a direct unit suite per call-path; tracked as
# follow-up after ADR-029 G.2/G.3 lands and stabilises the surface.
sonar.issue.ignore.multicriteria.dispatch-cognitive-complexity.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.dispatch-cognitive-complexity.resourceKey=kairix/core/queue/dispatch.py

# python:S107 (kairix/core/embed/embed.py — _run_embed_loop_parallel) —
# 14 params vs ceiling 13. The function is the per-batch parallel
# orchestrator; each param is a distinct concern (chunks /
# batch_size / parallel / db handle / vec_index handle / 4 Azure-config
# strings / current time / save_interval / total count / embed_batch fn /
# optional cache). Grouping any subset into a dataclass would obscure
# the call contract more than it clarifies — the only natural cluster
# is the 4 Azure strings, which would still leave 11 params. Paydown:
# extract AzureEmbedSpec(api_key, endpoint, deployment, actual_dims)
# when the next signature change to this function lands so the cleanup
# rides along instead of being its own commit.
sonar.issue.ignore.multicriteria.embed-parallel-params.ruleKey=python:S107
sonar.issue.ignore.multicriteria.embed-parallel-params.resourceKey=kairix/core/embed/embed.py

# python:S5443 — "Make sure publicly writable directories are used safely here."
# kairix/paths.py:1175 returns `/tmp/kairix/secrets` as the XDG_RUNTIME_DIR
# fallback when no logind session is present (Linux/macOS user-mode install).
# The fallback is mandated by the XDG base-dir spec (man pam_systemd) and
# matches every other Linux-userland app (systemd-tmpfiles seeds the same
# pattern). kairix.install.dirs creates the kairix-owned 0700 subdir before
# any secret is written, so the path is NOT world-writable in operator use.
# noqa: S108 (ruff equivalent) is suppressed inline; this entry covers Sonar's
# parallel rule.
sonar.issue.ignore.multicriteria.xdg-runtime-tmp-fallback.ruleKey=python:S5443
sonar.issue.ignore.multicriteria.xdg-runtime-tmp-fallback.resourceKey=kairix/paths.py
